  LORD OF THE PROMPT — PROMPT DECK  ·  llloc-UI (FIND V1.20 system)
  ============================================================================
  Rebuilt 17 Aug 2026 onto the locked llloc-UI system. What changed from the
  old Space-Mono deck, and why (each maps to a rule in llloc-ui):

   • IBM Plex Mono, six woff2, embedded as base64. NEVER a remote font link.
   • No box carries a stroke in LIGHT mode, and no box sits inside another box.
     ONE surface: page (--paper) > prompt block (--card). The card is flat.
     Dark mode puts every edge back through the --edge tokens.
     Three strokes survive, exactly as FIND keeps them: the rule above the
     bottom bar, the search field when focused, and a control switched ON.
   • Corners 1.5px, both --radius and --radius-sm.
   • Type ramp 400 / 500 / 700. Not 700 everywhere.
   • Nothing in the chrome exceeds 11px. Prompt text sits at the 11px cap;
     the L / M / S scaler is how the user makes it bigger.
   • Bottom bar on the panel floor, no top header. Wordmark . version .
     made by llllllloc . size / tips / theme pushed right, bare, no boxes.
   • L / M / S scaler on CSS zoom, never transform: scale().
   • The page cannot scroll. The card list scrolls inside its own box.
   • Styled hover tooltips from data-tip. Never the native title attribute.
   • FIND's scrollbar: 9px, --btn-line thumb, 2px paper inset.
   • One row height, --row-h:34px.
   • Theme defaults to dark, persisted, filled sun / moon SVG.

  THREE CARD STATES — unchanged in meaning, restyled:
   (A) SIMPLE CARD    — a V1 prompt, or a distinct scene with no history yet.
   (B) VERSION GROUP  — current card + the "● CURRENT" pill, and that
                        prompt's OWN history box directly under it.
   (C) JUST UPDATED   — same as (B) plus class "updated" and the
                        "✦ JUST UPDATED" badge, on the prompt(s) changed
                        THIS turn only.

  HARD RULES CARRIED OVER FROM THE SKILL:
   • ONE history box per prompt, inside that prompt's own group. Never merge
     two prompts' versions into one box.
   • Editing one prompt means re-emitting the WHOLE deck, same order, all
     prompts present. Only this turn's edits wear the accent.
   • Full prompt text, name line first, inside <pre class="prompt-text">.
     HTML-escape & < >. Never cross-reference another card.
   • Every prompt has its own COPY button. There is no COPY ALL.
   • No serial number on a card. the studio cut it 17 Aug 2026 - the prompt name
     already carries the version, so the serial said nothing twice.
-->

:root{
  /* ============ TIER 1 - PRIMITIVES ============
     The five colours from the studio's ARRIVAL FLEET sheet, 29 August 2026. Raw
     values, no opinion about where they are used. Nothing below this line
     invents a colour; it only points at one of these.

     Two of the five cannot carry small text, and that is measured, not felt:
       TERTIARY #909090 on CANVAS  = 3.19:1  (needs 4.5 for text, 3 for a mark)
       TERTIARY #909090 on SURFACE = 2.85:1  (under even the 3:1 mark floor)
       LIVE     #F44E16 on CANVAS  = 3.53:1  and white on LIVE is the same 3.53
     So the sheet gets two extra STEPS of the same two hues - not new colours,
     the legal text weight of colours that are already here. In DARK the five
     work unchanged, because a light value on a near-black page has room to
     spare. A five-colour sheet is complete for a dark UI and two short for a
     light one. */
  --c-canvas:#FFFFFF;      /* CANVAS   */
  --c-surface:#F2F2F2;     /* SURFACE  */
  --c-ink:#171717;         /* INK      */
  --c-live:#F44E16;        /* LIVE     */
  --c-tertiary:#909090;    /* TERTIARY - marks and disabled only, never text  */
  --c-tertiary-txt:#6B6B6B;/* the text step: 5.33 on canvas, 4.76 on surface  */
  --c-live-txt:#C93C0E;    /* the text step: 5.08 / 4.54, white on it 5.08    */
  /* tints on the same neutral axis, for chrome that needs a step between
     SURFACE and TERTIARY. Still one grey ramp and one accent. */
  --c-n-btn:#EAEAEA; --c-n-line:#E2E2E2; --c-n-btnline:#D6D6D6;

  /* ============ TIER 2 - SEMANTIC ============
     Roles. Every one points at a primitive and never at a raw value. This is
     what makes "limit colour to this" a five-line edit instead of a search
     through eight hundred lines of CSS. */
  /* the selected tab needs its own step. --card is 1.12:1 against the page in
     light and 1.11:1 in dark, which is a whisper, and the studio read it as "the
     contrast of color in here is not enough". A selected tab is NAVIGATION -
     it says where you are - so it gets a fill you can see. */
  /* THE BOX SITS BACK, THE TEXT AND THE RULE DO NOT.
     the studio, 29 August 2026: lower the opacity of the box only, keep the text and
     the accent rule as they are.
     This is a TRANSLUCENT FILL, never `opacity`. `opacity` fades an element and
     everything inside it, so the prompt text and the accent edge would go with
     it - the opposite of the ask. A background with alpha lowers only the
     paint it names.
     INK at 3.5% over the page = about #F7F7F7, roughly half the weight of the
     --card surface. Hover then steps it up to the full surface. */
  --surface-rest:rgba(23,23,23,.035);
  --tab-on:#E2E2E2;
  --paper:var(--c-canvas); --card:var(--c-surface); --field:var(--c-canvas);
  --btn:var(--c-n-btn); --btn-line:var(--c-n-btnline); --line:var(--c-n-line);
  --ink:var(--c-ink); --ink-soft:var(--c-tertiary-txt);
  --accent:var(--c-live);          /* fills, borders, marks: 3.53:1, clears 3 */
  --accent-dk:var(--c-live-txt);
  /* the accent as small TEXT on a light surface. Nothing in the deck uses it
     any more - every accent on screen is now the LIVE primitive, and where the
     accent had to carry text the pairing was inverted instead. Kept as the
     documented escape hatch for a build that genuinely needs it. */
  --accent-txt:var(--c-live-txt);
  --err:var(--c-live-txt);         /* one accent. There is no second red */
  /* ONE ORANGE ON SCREEN. The badge used to fill with --c-live-txt, the darker
     text step, which sat beside COPIED and the dots in pure LIVE - two oranges
     a shade apart, which reads as a mistake rather than a system. the studio: "this
     color is so weird."
     The fix is not a new colour, it is a different pairing: fill with LIVE and
     write on it in INK, which measures 5.08:1 and clears 4.5. Dark already did
     exactly this. Both themes now match. */
  --badge-bg:var(--c-live); --badge-fg:var(--c-ink);
  --radius:1.5px; --radius-sm:1.5px;
  --row-h:34px;
  /* ONE CONTROL HEIGHT PER ROW. the studio, 29 August 2026: "align the buttons sizes,
     make other button same height with the copy button now". A row of controls
     at three different heights reads as three different systems. The COPY
     button set the height, so every control in a card head takes it. */
  --ctl-h:26px;
  /* SPEED. the studio, 29 August 2026: "prioritize speed over everything."
     MEASURED FIRST, because the obvious answer was wrong. The JavaScript was
     never the problem - a tab click ran in 1.24ms, a keystroke in 0.08ms, a
     fold in 0.18ms, a scroll frame in 0.03ms, all far under RAIL's 50ms input
     budget. What felt slow was the two delays this file ASKED FOR: a 130ms
     transition on forty elements, and a 120ms lock on the wheel.
     So the transition is a token and the token is zero. NN/g's warning about
     "too fast" is about MOTION - a thing travelling, which needs time to be
     followed. Nothing here travels; these are colour changes, and a colour
     change at 0s reads as instant, not as jarring.
     One line to soften it if he ever wants that: set --t to 60ms. */
  --t:0s;
  /* EDGE TOKENS - light hides every edge, dark puts it back.
     These are TOKENS, not `html.dark .thing` rules, on purpose. A rule like
     `html.dark .copy-btn{...}` scores higher than `.copy-btn.copied{...}`, so
     the dark rule silently beat every state: the copied button stayed grey,
     the JUST UPDATED card lost its accent border, an armed button lost its
     ring. A token carries the theme without carrying specificity. */
  --edge:transparent;      /* card, spec sheet, prompt block */
  --edge-2:transparent;    /* controls: button, chip, field */
  --copy-bg:var(--btn-line);
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html.dark{
  /* DARK REUSES THE SAME FIVE, INVERTED. INK becomes the page, SURFACE becomes
     the ink, and TERTIARY and LIVE need no extra step because both clear 4.5:1
     against a near-black page: TERTIARY 5.62 / 5.04, LIVE 5.08 / 4.56.
     Only the neutral tints between them are new, and they sit on the same axis.
     CAUTION: those WCAG 2 numbers are less reliable here than they look - see
     the APCA note in the gate and in LOCKED-RULES. */
  --c-n-btn:#2A2A2A; --c-n-line:#2E2E2E; --c-n-btnline:#3A3A3A;
  /* THE DARK MUTED-TEXT STEP, and this one WCAG 2 could not have found.
     TERTIARY #909090 scores 5.62:1 here, a comfortable WCAG pass - and APCA
     scores the same pair at Lc42, under the Lc75 minimum for small text and
     barely over the Lc45 decorative floor. That gap is the overstatement the
     APCA author warns about once both colours are dark, measured on this file.
     #CCCCCC reaches Lc75, which matches what the light theme's #6B6B6B already
     scores (Lc77). Same move as light, mirrored: TERTIARY stays the MARK
     colour, and muted TEXT gets its own step. */
  --c-tertiary-txt:#CCCCCC;
  --surface-rest:rgba(242,242,242,.045);   /* SURFACE at 4.5% over the page */
  --tab-on:#3A3A3A;   /* 1.58:1 against the page - a step you can actually see */
  --paper:var(--c-ink); --card:#212121; --field:#1C1C1C;
  --ink:var(--c-surface); --ink-soft:var(--c-tertiary-txt);
  --accent:var(--c-live); --accent-dk:var(--c-live); --accent-txt:var(--c-live);
  --err:var(--c-live);
  --badge-bg:var(--c-live); --badge-fg:var(--c-ink);   /* same pairing as light */
  --edge:var(--line); --edge-2:var(--btn-line); --copy-bg:var(--btn);
}
*{box-sizing:border-box;margin:0;padding:0}

/* REDUCED MOTION, APPLIED WITH JUDGEMENT.
   The common version of this is `* {transition:none !important}`, and it is
   wrong: the preference asks for less MOTION, not for a UI with no feedback.
   A colour fade does not move anything and does not trigger a vestibular
   response, so the var(--t) hover fades stay. What goes is anything that TRAVELS:
   smooth scrolling, and the strip sliding a tab into view. */
@media (prefers-reduced-motion: reduce){
  html,body,#scroller,.trail{scroll-behavior:auto !important}
}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
          font-family:var(--font-mono);-webkit-font-smoothing:antialiased}
::selection{background:rgba(240,72,30,.26);color:var(--ink)}
::-moz-selection{background:rgba(240,72,30,.26);color:var(--ink)}
html.dark ::selection{background:rgba(240,72,30,.42);color:var(--ink)}
html.dark ::-moz-selection{background:rgba(240,72,30,.42);color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--btn-line);border:2px solid var(--paper);border-radius:0}
::-webkit-scrollbar-thumb:hover{background:var(--ink-soft)}

/* the scaler scales the LAYOUT, so height:100% reaches the floor by itself */
#zoomRoot{display:flex;flex-direction:column;zoom:var(--uis,1);height:100%}
/* THE COLUMN FILLS THE PANEL. THE TYPE HOLDS THE MEASURE.
   the studio, 29 August 2026: "make it always adapt to panel width as well, but of
   course have some margin."

   A 600px cap looked right at L and wasted a third of the panel at S, because
   the scaler runs on CSS `zoom`: at S every CSS pixel is smaller, so the same
   600px column paints narrower while the panel does not move. The smaller the
   UI, the more width it threw away.

   So the cap is gone and the column fills, with a margin that grows with the
   panel. The 80-character limit (WCAG 1.4.8) is then held by the TYPE instead:
   the prompt's font size is tied to the width of its own container, so a wider
   panel gets bigger type on the same number of characters. Fill and measure
   both hold, which a fixed cap could not do. */
.app{width:100%;max-width:1000px;margin:0 auto;
     padding:14px clamp(16px,4%,48px) 16px;
     display:flex;flex-direction:column;flex:1;min-height:0}

/* ---------- toolbar ---------- */
.tbar{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb{width:24px;height:24px;padding:0;border:1px solid var(--edge-2);border-radius:var(--radius-sm);
    background:var(--btn);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;transition:var(--t);flex-shrink:0}
.tb:hover{background:var(--ink);color:var(--paper)}
.tb.on{background:var(--accent);border-color:var(--accent);color:#fff}   /* armed - stroke allowed */
.tb svg{display:block}
.tbd{width:1px;height:16px;background:var(--line);flex-shrink:0;margin:0 2px}
/* the buttons sit hard right, so the toolbar ends on the same x as the cards */
.tbg{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}

/* search field - light has NO stroke, dark puts it back, focus arms the accent */
.fld{display:flex;align-items:center;gap:8px;border:1px solid var(--edge-2);border-radius:var(--radius-sm);
     background:var(--card);padding:0 6px 0 10px;height:24px;cursor:text;min-width:0;
     flex:1 1 auto;max-width:320px}
.fld:focus-within{border-color:var(--accent)}
html.dark .fld{background:var(--field)}
.fld .fl{font:500 9px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;
         color:var(--ink-soft);flex-shrink:0}
.fld input{flex:1;min-width:0;border:none;background:transparent;outline:none;
           font:500 10.5px var(--font-mono);letter-spacing:.09em;color:var(--ink)}
.fld input::placeholder{color:var(--ink-soft);opacity:1}
.clrb{width:16px;height:16px;padding:0;flex-shrink:0;display:none;align-items:center;
      justify-content:center;border:none;border-radius:var(--radius-sm);background:transparent;
      color:var(--ink-soft);cursor:pointer;transition:var(--t);font:500 11px var(--font-mono)}
.clrb:hover{color:var(--accent)}
.clrb.show{display:inline-flex}

/* ---------- the scroll region - the PAGE never scrolls ---------- */
.grow{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;
      margin-top:13px;padding-right:6px}   /* 6px of air to the scroll bar */

/* ---------- masthead ----------
   The eyebrow and the description line came out on 29 August 2026. The title IS
   the masthead now, and the rule under it opens the ladder - the device both of
   the studio's reference layouts use, where a heading sits on a hairline and the table
   hangs from it. The two classes are DELETED, not just unused: a class left
   behind is a class that comes back. */
h1{font:700 15px/1.25 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;
   margin:0 0 13px;padding:0 0 13px;
   border-bottom:1px solid var(--line)}   /* divider BETWEEN items - stroke allowed */

/* ---------- shared disclosure chevron ---------- */
summary{list-style:none;cursor:pointer;user-select:none}
summary::-webkit-details-marker{display:none}
.cv{flex:none;transition:transform var(--t);color:var(--ink-soft)}
details[open]>summary .cv{transform:rotate(90deg)}
summary:hover .cv{color:var(--ink)}

/* ---------- deck meta = SPEC SHEET, and it is a TABLE ----------
   Both of the studio's reference layouts are tables: a tiny wide-tracked label hard
   left, the value hard right, a hairline between. A table is the ONE place a
   rule per row earns its keep - the eye has to cross a wide gap to pair a label
   with its value, and the rule is what carries it across. eBay and Material both
   warn that a rule per item is noise; neither is talking about a table.
   Dropping the fill also leaves ONE painted surface on the page: the prompt. */
.meta{background:transparent;border:none;border-radius:0;padding:0;margin:0 0 4px}
.meta>summary{display:flex;align-items:center;gap:8px;padding:0 0 9px;
              font:500 9px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;
              color:var(--ink-soft)}
.meta>summary:hover{color:var(--ink)}
.spec{display:flex;align-items:center;gap:12px;min-height:26px;padding:6px 0;
      border-top:1px solid var(--line)}   /* divider BETWEEN items - stroke allowed */
.spec .k{font:500 9px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;
         color:var(--ink-soft);flex-shrink:0}
.spec .v{margin-left:auto;font:700 9.5px var(--font-mono);letter-spacing:.04em;
         color:var(--ink);text-align:right;word-break:break-word}

/* ---------- card ---------- */
/* THE CARD IS FLAT. the studio, 29 August 2026: "I dont like how the prompt is boxed
   inside a prompt card". It was a white block inside a grey block - two nested
   boxes, and the design system already forbids that: ".card transparent,
   borderless. Content sits on the page."
   The tabs are what made the fix free. A card used to need a fill so the reader
   could tell one prompt from the next in a long stack. With one prompt on screen
   there is nothing to tell apart, so the fill has no job left.
   ONE surface remains, and it is the prompt - the thing he copies. */
.card{background:transparent;border:none;border-radius:0;
      margin:0 0 18px;color:var(--ink);
      content-visibility:auto;contain-intrinsic-size:auto 240px}
@media print{.card{content-visibility:visible}}
/* the JUST UPDATED state is carried by its badge and by the dot on its tab.
   The accent rule is now on every prompt, so it can no longer mark one. */
/* THE HEAD IS BARE. A RULE DIVIDES, AND HOVER SAYS WHERE YOU ARE.
   the studio tried the filled head and sent it back on 29 August 2026: "dont really
   like the box background here. I prefer previous verion, but maybe add some
   divider line between each prompt card. Or when mouse hover to a card it'll
   be highlighted." So both, and the fill is gone.
   The divider is the FOURTH stroke this system allows, and it is the same
   species as the rule above the bottom bar: a line BETWEEN items in a list,
   never a line AROUND a box. See LOCKED-RULES. */
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
           min-height:var(--row-h);padding:2px 0}   /* bare - one left edge with the block */
.card[open]>.card-head{padding-bottom:7px}
/* HOVER — the marks respond, not a block.
   the studio, 29 August 2026: the grey block that appeared under a head row "doest
   look sleek enough". Two reasons it read badly, and both are in the sources:

   1. eBay's playbook splits the two cases. An element WITH a container takes a
      state layer - a semi-transparent fill. An element with NO container takes
      an ink shift instead. The head row lost its container earlier the same
      day, so a fill was the wrong species for it.
   2. Material 3 puts a hover layer at 8% and says to keep it low so it does not
      distract. Ours measured about 7%, so the opacity was right - the SHAPE was
      wrong. A hard-edged rounded block appearing and vanishing under bare text
      reads as a flash, not as a state.

   The hover still has a job. GitLab's own issue names it: on a wide row you
   cannot tell which item the button on the far right belongs to. So three small
   marks answer instead of one big one - the ID chip inverts (FIND's own button
   hover), the character count comes up to full ink, and the rules above and
   below the row darken so the row is bracketed. */
@media (hover:hover) and (pointer:fine){
  .card:hover>.card-head .tab{color:var(--ink)}
  .card:hover>.card-head .chars{color:var(--ink)}
  /* THE PROMPT BLOCK ANSWERS TOO. the studio, 29 August 2026: "I want hovering effect
     for these card."
     A fill is the RIGHT species here, and that is not a contradiction of the
     head row. eBay's playbook splits the two cases: an element WITH a container
     takes a state layer - a fill - while an element with NO container takes an
     ink shift. The head row has no container, so it shifts ink. The prompt block
     IS a container, so it takes the layer.
     The step is --btn, which measures as roughly a 4% overlay on --card in both
     themes - eBay's per-state increment, and inside Material's guidance that a
     hover layer stays low so it does not distract. On a block this large,
     anything more reads as a flash.
     It also earns its keep: the block is the click-to-copy target, and until now
     the biggest button on the page was the only one with no hover state. */
  .prompt-text:hover{background:var(--btn)}
  /* the divider is STRUCTURE, not state. Darkening it on hover made the ladder
     twitch as the pointer moved down the page - the studio, 29 August 2026:
     "hovering should not highlight the divider line". The chip and the count
     answer instead, and the grid holds still. */
}
.card-head .dot{width:8px;height:8px;border-radius:var(--radius-sm);background:var(--accent);flex:none}
/* THE ID IS TEXT, NOT A BOX. the studio, 29 August 2026: "remove the box, leave the
   text only; while hovering the text become darker." One fewer painted surface
   per row, and the hover answer is now a value shift rather than an inversion -
   which is also the eBay rule for an element with no container. */
.tab{display:inline-flex;align-items:center;height:var(--ctl-h);flex:none;
     font:700 8px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
     color:var(--ink-soft);background:none;border:none;border-radius:0;
     transition:color var(--t)}
/* .dim - OLDER, and any quiet qualifier in a head row.
   THIS RULE WENT MISSING. It used to be `.card-id .dim`, and when .card-id was
   deleted on 29 August 2026 the descendant selector went with it, so .dim had
   no rule at all and inherited the 16px body size. the studio saw it as "this word is
   so big". A class whose only rule was scoped to a deleted parent is invisible
   to every test that checks colour or layout, because it still renders - just
   at the wrong size. When you delete a container, grep for its descendants. */
.dim{font:500 8.5px var(--font-mono);letter-spacing:.06em;color:var(--ink-soft);flex:none}

/* the character count, filled by the engine from the text COPY actually puts
   on the clipboard. Never typed by hand, so it can never be wrong.
   the studio, 29 August: "put the character count somewhere here". */
.chars{flex:none;font:500 8.5px var(--font-mono);letter-spacing:.09em;
       text-transform:uppercase;color:var(--ink-soft);transition:color var(--t)}
/* THE `CURRENT` PILL IS GONE. the studio, 29 August 2026: "no need for current box,
   remove." He is right - a prompt sitting directly above its own version history
   is obviously the current one. The pill was labelling a fact the layout already
   states. What survives is its TREATMENT, which he asked for on the badge:
   an outline, a mark, and ink text.

   JUST UPDATED now wears that treatment. The accent moves from a fill to a
   1px border and a 5px dot - both non-text, and 3.53:1 clears the 3:1 those
   need - while the label reads in ink at 17.93:1. Quieter, legal, and one less
   loud rectangle in a stack of ten rows.

   The mark is a span, not a glyph: a text bullet sits high in its em box and
   will not centre against 8px caps. */
.badge-new{display:inline-flex;align-items:center;gap:7px;height:var(--ctl-h);padding:0 10px;flex:none;
           font:700 8px var(--font-mono);letter-spacing:.12em;color:var(--ink);
           background:none;border:1px solid var(--accent);   /* ON - stroke allowed */
           border-radius:var(--radius-sm)}
.badge-new .bdot{width:5px;height:5px;flex:none;border-radius:50%;background:var(--accent)}
.badge-new svg{display:none}   /* an old build may still pass a star; hide it */
/* light: --btn is the same tone as --card, so the button vanished. One step darker. */
.copy-btn{height:var(--ctl-h);padding:0 14px;flex:none;border:1px solid var(--edge-2);border-radius:var(--radius-sm);
          background:var(--copy-bg);color:var(--ink);font:700 9.5px var(--font-mono);letter-spacing:.13em;
          text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;
          justify-content:center;transition:var(--t);line-height:1;white-space:nowrap;
          margin-left:auto}   /* holds the right edge even when the head wraps */
.card-head .chars{margin-left:auto}
.card-head .chars+.copy-btn{margin-left:8px}
.copy-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.copy-btn.copied{background:var(--accent);border-color:var(--accent);color:#fff}
.copy-btn.failed{background:var(--err);border-color:var(--err);color:#fff}

/* the prompt block - a lighter tone inset in the card. No stroke in light. */
/* FLUID TYPE, TUNED SO THE LINE HOLDS ABOUT 76 CHARACTERS AT ANY WIDTH.
   1cqw is one percent of this block's own width. The coefficient is measured,
   not guessed: at 11px IBM Plex Mono one character advances 0.637em, so a line
   of 76 needs 48.4em, and 100 / 48.4 = 2.07. Floor 11px so a narrow dock keeps
   the ladder; ceiling 20px so a wide monitor does not turn a prompt into a
   poster. Above that ceiling the line lengthens, and the gate watches it. */
.prompt-text{font:400 11px/1.7 var(--font-mono);font-size:clamp(11px,2.07cqw,20px);
             letter-spacing:.01em;color:var(--ink);
             background:var(--surface-rest);border-radius:var(--radius);
             white-space:pre-wrap;word-break:break-word;margin:0;padding:13px 15px 15px;
             transition:background var(--t),color var(--t);
             border-left:2px solid var(--accent)}   /* ON - stroke allowed */
/* dark puts the edges back on three sides only. The left belongs to the accent
   rule above, and a shorthand `border` here would quietly overwrite it - a
   specificity trap this file has been caught by before. */
html.dark .prompt-text{border-top:1px solid var(--edge);border-right:1px solid var(--edge);
                       border-bottom:1px solid var(--edge)}


/* ---------- shotlist checkbox (SHOTLIST decks only) ----------
   Unchecked is a control switched OFF, so it carries no stroke - the white
   fill against the grey card is the whole mark. Checked is a control
   switched ON, which is one of the three places a stroke survives. */
.ck{width:15px;height:15px;padding:0;flex:none;border:1px solid transparent;
    border-radius:var(--radius-sm);background:var(--field);color:#fff;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;transition:var(--t)}
.ck{position:relative}
.ck::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;
           transform:translate(-50%,-50%)}
.ck svg{display:none}
.ck.on{background:var(--accent);border-color:var(--accent)}
.ck.on svg{display:block}
.card.done>.card-head .tab{color:var(--ink-soft);text-decoration:line-through}
.foot #prog{display:none;margin-left:4px}
.foot #prog.show{display:inline}

/* ---------- the divider between prompts ----------
   THIRD ATTEMPT, and the sources say why the first two read wrong.

   It was a border-TOP with 20px of margin above and 16px of padding below, so
   the rule sat almost centred between two rows and belonged to neither. It
   floated, and the studio called it out twice. Tufte's own note on tables is the fix:
   a row has a line directly BELOW it, and the distance to the NEXT line is
   larger than the distance to its own row. The rule now belongs to the row
   above it - 10px under the content, 18px of air before the next row starts.

   That also retires the .lead class. Marking the first VISIBLE row only existed
   because the rule was on top; with the rule underneath, every row carries its
   own and the last one closes the table.

   The rule stays --line and stays 1px. The data has to dominate the grid, not
   the other way round. */
#scroller>.card,#scroller>.group{border-bottom:1px solid var(--line);
                                 padding:0 0 10px;transition:border-color var(--t)}

/* ---------- version stack - one box per prompt, inside its own group ---------- */
.group{margin:0 0 18px}
.group>.card{margin:0}
.archive{margin:6px 0 0}
.archive>summary{display:flex;align-items:center;gap:7px;height:26px;padding:0 12px;
                 border-radius:var(--radius-sm);
                 font:500 9px var(--font-mono);letter-spacing:.13em;text-transform:uppercase;
                 color:var(--ink-soft);transition:var(--t)}
.archive>summary:hover{color:var(--ink);background:var(--btn)}
.archive .card{margin:10px 0 0 14px;opacity:.66;transition:opacity var(--t)}
.archive .card:hover{opacity:1}
.archive .card .card-head .dot{background:var(--ink-soft)}

/* ---------- zero-result note - a FAILURE speaks, a success stays quiet ---------- */
.note{display:none;font:500 9.5px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
      color:var(--err);padding:14px 2px}
.note.show{display:block}

/* ================= TAB STRIP — one prompt on screen at a time =================
   Cloned from FIND: the 24px .tb button, the .tbd divider, the 1.5px radius and
   the --edge token that carries the theme.

   Every number here is measured, not chosen.

   • 30px tab height. 30 x 0.83 (the S size step) = 24.9 CSS px, so the target
     still clears WCAG 2.2 SC 2.5.8 (24 x 24) at the SMALLEST UI size. The size
     ladder allows a content target to pass 24px and asks for the reason in a
     comment. This is the reason.
   • An unselected tab label is --ink, never --ink-soft. A tab is a control, so
     its text needs 4.5:1. Light --ink-soft measures 3.46:1 on white and fails.
     NN/g: an unselected tab that reads as grey reads as disabled.
   • The selected tab carries THREE marks — weight 700, the accent underline and
     the --card fill. NN/g measured that one mark alone (bold) gets missed.
   • The underline sits on the edge that touches the panel, so the eye joins the
     tab to its content.
   • The rail scrolls. It never wraps to a second row. NN/g: a second row makes
     the tabs jump and kills the reader's spatial memory.
   • The fade at a rail end is the "there is more" signal. A hidden scrollbar
     with no fade hides the fact that tabs are off screen. That bug has been
     open in editors for years and it is the one visible in the studio's screenshot.
*/
.tabs{display:flex;align-items:flex-end;flex-shrink:0;gap:6px;
      margin:11px 0 0;padding:0 0 0 0;border-bottom:1px solid var(--edge)}
.trail{flex:1 1 auto;min-width:0;display:flex;align-items:flex-end;gap:2px;
       overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;
       scrollbar-width:none;-ms-overflow-style:none;scroll-padding-inline:12px}
.trail::-webkit-scrollbar{display:none}
.trail.fadeR{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent);
                     mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent)}
.trail.fadeL{-webkit-mask-image:linear-gradient(90deg,transparent,#000 30px);
                     mask-image:linear-gradient(90deg,transparent,#000 30px)}
.trail.fadeL.fadeR{-webkit-mask-image:linear-gradient(90deg,transparent,#000 30px,#000 calc(100% - 30px),transparent);
                           mask-image:linear-gradient(90deg,transparent,#000 30px,#000 calc(100% - 30px),transparent)}

.tbn{flex:none;height:30px;padding:0 11px;display:inline-flex;align-items:center;gap:7px;
     border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;
     color:var(--ink);cursor:pointer;white-space:nowrap;transition:background var(--t),color var(--t)}
/* the dot marks a prompt that changed this turn, so the tab strip says WHERE
   the change is before you click. the studio, 29 August: "add a dot for just updated
   prompt / new prompt". A 5px accent square is a state mark, not text - WCAG
   1.4.11 asks 3:1 of it and the vermilion measures 3.72:1 on the page. */
/* a DOT, not a rounded square. the studio, 29 August 2026: "update this to be a dot
   instead." At 5px the 1.5px house radius reads as a soft square, which beside
   round marks elsewhere looks like a third shape nobody chose. */
.tbn .tdot{width:5px;height:5px;flex:none;border-radius:50%;
           background:var(--accent);margin-right:-2px}
.tbn .tn{font:700 9px var(--font-mono);letter-spacing:.12em;color:var(--ink-soft)}
.tbn .tl{font:500 9.5px var(--font-mono);letter-spacing:.06em;color:var(--ink);
         max-width:16ch;overflow:hidden;text-overflow:ellipsis}
/* A HOVER THAT COULD BE MISTAKEN FOR A SELECTED STATE IS SCOPED TO A REAL
   CURSOR. Touch never fires a "pointer left" event, so on a tablet a tapped tab
   keeps its hover fill and the strip appears to have two tabs selected. The
   media query is the fix, and it needs both halves: many mobile browsers claim
   hover:hover because of long-press, so (pointer:fine) is what actually sorts
   them. A plain button's hover can stay unscoped - a stuck button says nothing
   false. A stuck ROW or TAB does. */
@media (hover:hover) and (pointer:fine){
  .tbn:hover{background:var(--btn)}
  .tbn:hover .tn{color:var(--ink)}
}
/* FOUR MARKS ON THE SELECTED TAB, because in dark the fill alone was a whisper:
   the fill steps up to --tab-on, the label goes to FULL ink while unselected
   labels sit at --ink-soft, the weight goes to 700, and the accent underline
   holds the bottom edge. NN/g asks for two. Dark needed four. */
.tbn .tl{color:var(--ink-soft)}
.tbn[aria-selected="true"]{background:var(--tab-on);border-bottom-color:var(--accent)}  /* ON - stroke allowed */
.tbn[aria-selected="true"] .tl{font-weight:700;color:var(--ink)}
/* the number goes to full ink, not to a second orange. The selected tab already
   wears four marks; a fifth in a slightly different vermilion was the thing that
   made the accent look like two colours. */
.tbn[aria-selected="true"] .tn{color:var(--ink)}
.tbn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* a done shot greys its tab, exactly as it greys its card */
.tbn.done .tl{color:var(--ink-soft);text-decoration:line-through}
/* ALL never scrolls away. It is the escape hatch from every trap tabs carry:
   browser find, print, and reading the set straight through. */
.tabs .allb{flex:none}
.tabs .allb .tl{letter-spacing:.12em;text-transform:uppercase;font-weight:700}

/* ================= CARD BODY =================
   the studio cut the rail on 29 August 2026: SIZE, LENS, LIGHT and the WATCH OUT
   block all came out of the card. The deck-level SPEC sheet already carries
   the facts that stay the same across a deck, and a per-card fact sheet beside
   a 600px column was the thing making the gap.
   A card is now a head row and a prompt. Nothing else. */
/* the container the prompt measures itself against */
.cbody{display:block;margin:0;container-type:inline-size}

/* ---------- bottom bar - on the floor, bare, no boxes ---------- */
.foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex-shrink:0;
      margin-top:11px;padding:9px 0 0;border-top:1px solid var(--line);   /* stroke 1 of 3 */
      font:700 8.5px var(--font-mono);letter-spacing:.05em;color:var(--ink-soft)}
.foot .fbrand{font:700 8.5px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
              color:var(--ink);text-decoration:none;transition:var(--t)}
.foot .fbrand:hover{color:var(--accent)}
.foot .chip{border:none;background:none;padding:0;height:auto;color:var(--ink);
            font:700 8.5px var(--font-mono);letter-spacing:.05em;margin-left:-3px}
.foot .fby{margin-left:3px}
.foot .fby b{font-weight:700}   /* pin it - <b> defaults to 900 and the ramp is 400/500/700 */
.foot .fbtns{margin-left:auto;display:flex;align-items:center;gap:11px}
.foot .hbtn{width:14px;height:14px;min-width:0;padding:0;margin:0;border:none;background:none;
            color:var(--ink);line-height:1;cursor:pointer;display:inline-flex;align-items:center;
            justify-content:center;transition:var(--t)}
.foot .hbtn svg{width:12px;height:12px;display:block}
.foot .hbtn:hover{color:var(--accent)}
/* the HIT BOX is 24px, the mark stays 14px. WCAG 2.2 SC 2.5.8 counts the area
   you can click, not the picture inside it. The pseudo-element grows the area
   and moves nothing on screen. */
.foot .hbtn{position:relative}
.foot .hbtn::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;
                   transform:translate(-50%,-50%)}
.foot .hbtn.off{color:var(--ink-soft)}
.foot #sizeBtn{font:700 11px/1 var(--font-mono);letter-spacing:0}

/* ---------- narrow dock ---------- */
@media (max-width:200px){
  .app{padding:8px 6px 12px}
  .tbar{flex-wrap:wrap;justify-content:center}
  .fld{flex:1 0 100%;max-width:none}
  .tbg{margin-left:0}
  #tip{max-width:88px}
  .foot{flex-direction:column;align-items:center;gap:4px;margin-top:6px;padding:6px 0 0;border-top:none}
  .foot .fbrand,.foot .fby,.foot .chip{display:none}
  .foot .fbtns{margin-left:0}
}

/* PRINT — tabs hide content, so paper gets every prompt and no strip.
   The same reason the ALL tab exists. */
@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#000}
  .tbar,.tabs,.foot,#tip{display:none !important}
  .grow{overflow:visible;height:auto}
  .group,.card{display:block !important;break-inside:avoid}
  .prompt-text{max-width:none}
}
#tip{position:fixed;z-index:99;max-width:210px;background:var(--ink);color:var(--paper);
     font:700 8.5px/1.55 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;
     padding:6px 8px;border-radius:var(--radius-sm);pointer-events:none;display:none}
</style>
</head>
<body>
<div id="zoomRoot">
<div class="app">

  <!-- ============================ TOOLBAR ============================ -->
  <div class="tbar">
    <div class="fld" id="qFld" data-tip="Filter the deck — matches a prompt name or any word inside a prompt">
      <span class="fl">SEARCH</span>
      <input id="q" type="text" placeholder="" spellcheck="false" data-tip="Filter the deck">
      <button class="clrb" id="qClr" data-tip="Clear the filter" aria-label="Clear">&#215;</button>
    </div>
    <span class="tbg">
    <button class="tb" id="onlyNew" data-tip="Show only the prompts changed this turn" aria-label="Show only updated">
      <svg width="12" height="12" viewBox="0 0 14 14"><path d="M7 1.4 8.15 5.85 12.6 7 8.15 8.15 7 12.6 5.85 8.15 1.4 7 5.85 5.85Z" fill="currentColor"/></svg>
    </button>
    <span class="tbd"></span>
    <button class="tb" id="foldAll" data-tip="Collapse everything" aria-label="Collapse or open everything"></button>
    </span>
  </div>

  <!-- ============================ TAB STRIP ============================
       The strip sits OUTSIDE the scroll region on purpose. A sticky strip
       inside it would sit over a card that has keyboard focus, which is the
       W3C's own named failure F110 for SC 2.4.11. Outside, it cannot.
       The buttons are built by the engine. Never write a tab by hand. -->
  <div class="tabs" id="tabs" role="tablist" aria-label="Prompts">
    <div class="trail" id="trail"></div>
  </div>

  <!-- ==================== SCROLL REGION (the page never scrolls) ==================== -->
  <div class="grow" id="scroller">

    <!--DECK-->

    <p class="note" id="note">NO PROMPT MATCHES THAT FILTER</p>
  </div>

  <!-- ============================ BOTTOM BAR ============================ -->
  <div class="foot">
    <a class="fbrand" href="https://lucky-gecko-1ca0d6.netlify.app/" target="_blank" rel="noopener"
       data-tip="Lord Of The Prompt">LORD OF THE PROMPT.</a>
    <span class="chip">V3</span>
    <span class="chip" id="prog"></span>   <!-- deck TEMPLATE version. Bump it when this shell changes. -->

    <span class="fby"><span class="fpre">made by </span><b>llllllloc</b></span>
    <span class="fbtns">
      <button class="hbtn" id="sizeBtn" data-tip="UI size — click to cycle L / M / S">L</button>
      <button class="hbtn" id="tipBtn" aria-label="Toggle hover tips"></button>
      <button class="hbtn" id="themeBtn" data-tip="Dark / light theme" aria-label="Toggle dark or light theme"></button>
    </span>
  </div>

</div>
</div>
<div id="tip"></div>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };
var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

/* ---------------- theme - defaults to dark ---------------- */
var DARK = true;
try { var t0 = localStorage.getItem("lotp.theme"); if (t0) DARK = (t0 === "dark"); } catch (e) {}
var SUN = '<svg width="12" height="12" viewBox="0 0 14 14"><circle cx="7" cy="7" r="3.1" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 .6v1.7M7 11.7v1.7M.6 7h1.7M11.7 7h1.7M2.5 2.5l1.2 1.2M10.3 10.3l1.2 1.2M11.5 2.5l-1.2 1.2M3.7 10.3l-1.2 1.2"/></g></svg>';
var MOON = '<svg width="12" height="12" viewBox="0 0 14 14"><path d="M12.1 9.1A5.9 5.9 0 0 1 4.9 1.9 5.9 5.9 0 1 0 12.1 9.1Z" fill="currentColor"/></svg>';
function applyTheme() {
  document.documentElement.classList.toggle("dark", DARK);
  $("themeBtn").innerHTML = DARK ? SUN : MOON;
}
$("themeBtn").addEventListener("click", function () {
  DARK = !DARK;
  try { localStorage.setItem("lotp.theme", DARK ? "dark" : "light"); } catch (e) {}

applyTheme();

/* ---------------- UI size - CSS zoom, never transform:scale ---------------- */
var SIZES = [["L", 1.16], ["M", 0.98], ["S", 0.83]];
var sizeIx = 0;
try {
  var si = parseInt(localStorage.getItem("lotp.size") || "0", 10);
  if (si >= 0 && si < SIZES.length) sizeIx = si;
} catch (e) {}
function applySize() {
  var s = SIZES[sizeIx][1];
  document.documentElement.style.setProperty("--uis", String(s));
  var tp = $("tip");
  if (tp) {
    tp.style.fontSize = (8.5 * s).toFixed(2) + "px";
    tp.style.padding = (6 * s).toFixed(1) + "px " + (8 * s).toFixed(1) + "px";
    tp.style.maxWidth = Math.round(210 * s) + "px";
  }
  var sb = $("sizeBtn");
  sb.textContent = SIZES[sizeIx][0];
  sb.setAttribute("data-tip", "UI size: " + SIZES[sizeIx][0] + " — click to cycle L / M / S");
  fitFooter();
  if (window.__fades) window.__fades();   /* the rail is wider once Plex lands */
}
$("sizeBtn").addEventListener("click", function () {
  sizeIx = (sizeIx + 1) % SIZES.length;
  try { localStorage.setItem("lotp.size", String(sizeIx)); } catch (e) {}
  applySize();
});

/* the bar sheds parts as it narrows.
   TWO BUGS LIVED HERE, and together they emptied the bar at every width.
   1. The test was `scrollWidth <= clientWidth + 1`. Under CSS zoom those two
      numbers round differently, so the bar measured 5px too wide even when it
      was empty. The condition could never be true, so the loop ran to the end
      and hid EVERYTHING. That is the pixel-kind trap in LOCKED-RULES, and it
      shipped. The tolerance is now 6px, which survives the rounding.
   2. The shed order ended with the wordmark, so the identity was the thing it
      threw away. the studio: "bring back Lord of the prompt name + version name
      here". The name and the version never shed now. Only "made by" does. */
function fitFooter() {
  var f = document.querySelector(".foot");
  if (!f) return;
  var brand = f.querySelector(".fbrand"), chip = f.querySelector(".chip"),
      by = f.querySelector(".fby"), pre = f.querySelector(".fpre");
  var parts = [brand, chip, by, pre], i;
  for (i = 0; i < parts.length; i++) { if (parts[i]) parts[i].style.display = ""; }
  var order = [pre, by];          /* the name and the version are never shed */
  for (i = 0; i < order.length; i++) {
    if (f.scrollWidth - f.clientWidth <= 6) break;
    if (order[i]) order[i].style.display = "none";
  }
}
window.addEventListener("resize", function () { applySize(); });
try {
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    document.fonts.ready.then(function () { applySize(); });
  }
} catch (e) {}
var __RETRY = [60, 250, 600, 900, 1800, 3000], __ri;
for (__ri = 0; __ri < __RETRY.length; __ri++) {
  setTimeout(function () { applySize(); }, __RETRY[__ri]);
}

/* ---------------- hover tips - data-tip, never the native title ---------------- */
var TIPS = true;
try { var tp0 = localStorage.getItem("lotp.tips"); if (tp0 !== null) TIPS = (tp0 !== "0"); } catch (e) {}
var tipEl = $("tip");
function findTip(el) {
  while (el && el !== document.body && el.getAttribute) {
    if (el.getAttribute("data-tip")) return el;
    el = el.parentNode;
  }
  return null;
}
function showTip(el) {
  tipEl.textContent = el.getAttribute("data-tip");
  tipEl.style.display = "block";
  var r = el.getBoundingClientRect();
  var tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  var x = clamp(r.left + r.width / 2 - tw / 2, 6, window.innerWidth - tw - 6);
  var y = r.bottom + 7;
  if (y + th > window.innerHeight - 6) y = r.top - th - 7;
  tipEl.style.left = x + "px";
  tipEl.style.top = y + "px";
}
function hideTip() { tipEl.style.display = "none"; }
document.addEventListener("mouseover", function (e) {
  if (!TIPS) { hideTip(); return; }
  var el = findTip(e.target);
  if (el) showTip(el); else hideTip();
});
document.addEventListener("mouseout", function (e) { if (!e.relatedTarget) hideTip(); });
document.addEventListener("mousedown", hideTip);
document.addEventListener("scroll", hideTip, true);
window.addEventListener("blur", hideTip);

var BUB = '<svg width="12" height="12" viewBox="0 0 14 14"><path d="M2 3h10v6.2H5.8L3.2 11.6V9.2H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
var BUB_OFF = '<svg width="12" height="12" viewBox="0 0 14 14"><path d="M2 3h10v6.2H5.8L3.2 11.6V9.2H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><line x1="1.2" y1="12.8" x2="12.8" y2="1.2" stroke="currentColor" stroke-width="1.4"/></svg>';
function applyTips() {
  var b = $("tipBtn");
  b.innerHTML = TIPS ? BUB : BUB_OFF;
  b.className = "hbtn" + (TIPS ? "" : " off");
  b.setAttribute("data-tip", "Hover tips — click to turn them " + (TIPS ? "off" : "on"));
  if (!TIPS) hideTip();
}
$("tipBtn").addEventListener("click", function () {
  TIPS = !TIPS;
  try { localStorage.setItem("lotp.tips", TIPS ? "1" : "0"); } catch (e) {}
  applyTips();
});
applyTips();

/* ---------------- units, tabs and filter — ONE renderer ----------------
   The tab strip, the SEARCH box and the star filter all decide the same thing:
   which units are on screen. Two functions writing style.display fight each
   other, so there is one render() and everything calls it. */
var UNITS = [];
(function () {
  var host = $("scroller"), n;
  for (n = host.firstElementChild; n; n = n.nextElementSibling) {
    if (n.classList.contains("group") || (n.classList.contains("card") && !n.closest(".group"))) {
      UNITS.push(n);
    }
  }
})();

var ONLY_NEW = false;
var TAB = 0;              /* 0 = ALL, 1..n = that unit */
var TABS = [];            /* the buttons, index 0 is ALL */

/* WHAT A SEARCH LOOKS THROUGH.
   The unit's own text, PLUS its tab number and tab name. Those two live only
   on the strip since the repeated title came out of the head on 29 August
   2026, so without them a search for "litany" would find nothing at all.
   Built once, on first use, which is after the prompt normalizer has run. */
var HAY = null;
function haystack() {
  if (HAY) return HAY;
  HAY = [];
  for (var i = 0; i < UNITS.length; i++) {
    HAY.push(((UNITS[i].getAttribute("data-tab") || "") + " "
            + (UNITS[i].getAttribute("data-tname") || "") + " "
            + (UNITS[i].textContent || "")).toLowerCase());
  }
  return HAY;
}
function matches(i, term) {
  var u = UNITS[i];
  if (ONLY_NEW && u.getAttribute("data-new") !== "1") return false;
  if (term && haystack()[i].indexOf(term) === -1) return false;
  return true;
}

function unitLabel(u) {
  /* the fallback tab name, used only when a unit carries no data-tname */
  var head = u.querySelector(".card-head .tab");
  return head ? head.textContent.trim() : "";
}
/* render() only DRAWS. It used to steer the tab strip as well, which meant it
   called selectTab, which called render. Deciding and drawing are split now. */
function render() {
  var term = ($("q").value || "").trim().toLowerCase();
  var shown = 0, i, hit;
  for (i = 0; i < UNITS.length; i++) {
    hit = matches(i, term) && (TAB === 0 || i === TAB - 1);
    UNITS[i].style.display = hit ? "" : "none";
    if (hit) shown++;
  }
  $("note").className = shown ? "note" : "note show";
  $("qClr").className = term ? "clrb show" : "clrb";
}

/* A SEARCH STEERS THE TAB STRIP. the studio, 29 August 2026: "when user search for a
   prompt, it should auto jump to that prompt tab also."
   One match, and the strip goes to that prompt's tab, so the strip agrees with
   what is on screen instead of still reading ALL. No match or several, and it
   falls back to ALL - which is also what makes a search reach ACROSS tabs at
   all, since browser find cannot see a hidden panel. Clearing the box returns
   to ALL. */
function steer() {
  if (!window.__applyTab) return;                 /* a one-prompt deck has no strip */
  var term = ($("q").value || "").trim().toLowerCase();
  if (!term) { window.__applyTab(0, false); return; }
  var hits = [], i;
  for (i = 0; i < UNITS.length; i++) if (matches(i, term)) hits.push(i);
  window.__applyTab(hits.length === 1 ? hits[0] + 1 : 0, false);
}
function refresh() { steer(); render(); }

$("q").addEventListener("input", refresh);
$("qClr").addEventListener("click", function () { $("q").value = ""; refresh(); $("q").focus(); });
$("qFld").addEventListener("click", function () { $("q").focus(); });
$("onlyNew").addEventListener("click", function () {
  ONLY_NEW = !ONLY_NEW;
  this.className = "tb" + (ONLY_NEW ? " on" : "");
  this.setAttribute("data-tip", ONLY_NEW ? "Showing only this turn's changes — click to show all"
                                         : "Show only the prompts changed this turn");
  refresh();
});

/* ---------------- the tab strip ----------------
   One tab for each prompt, plus an ALL tab that never scrolls away. Panels are
   already in the DOM, so a tab activates the moment it takes focus — the APG
   rule: automatic activation when the panel shows with no wait.
   Fewer than two prompts and the strip does not appear at all. */
(function () {
  var strip = $("tabs"), rail = $("trail");
  if (!strip || UNITS.length < 2) { if (strip) strip.style.display = "none"; return; }

  function mk(num, name, ix, isAll, isNew) {
    var b = document.createElement("button");
    b.className = "tbn" + (isAll ? " allb" : "");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", ix === 0 ? "true" : "false");
    b.tabIndex = ix === 0 ? 0 : -1;
    b.setAttribute("data-tip", isAll ? "Show every prompt in one list — use this to search, print or read straight through"
                                     : "Show " + (num ? num + " " : "") + name + " on its own"
                                       + (isNew ? " — changed this turn" : ""));
    b.innerHTML = (isNew ? '<span class="tdot" aria-hidden="true"></span>' : "")
                + (num ? '<span class="tn"></span>' : "") + '<span class="tl"></span>';
    if (num) b.querySelector(".tn").textContent = num;
    b.querySelector(".tl").textContent = name;
    b.addEventListener("click", function () { selectTab(ix, true); });
    TABS.push(b);
    return b;
  }

  strip.insertBefore(mk("", "All", 0, true), rail);
  UNITS.forEach(function (u, i) {
    var num = u.getAttribute("data-tab") || String(i + 1);
    var name = u.getAttribute("data-tname") || unitLabel(u) || ("Prompt " + (i + 1));
    rail.appendChild(mk(num, name, i + 1, false, u.getAttribute("data-new") === "1"));
  });

  /* applyTab moves the STRIP and nothing else. selectTab is applyTab plus a
     redraw, for a click or a key press. The search calls applyTab and draws
     once itself, so the two never call each other in a loop. */
  window.__applyTab = function (ix, focus) {
    if (ix === TAB && !focus) return;
    TAB = ix;
    for (var i = 0; i < TABS.length; i++) {
      var on = (i === ix);
      TABS[i].setAttribute("aria-selected", on ? "true" : "false");
      TABS[i].tabIndex = on ? 0 : -1;
    }
    if (focus) TABS[ix].focus();
    if (ix > 0) TABS[ix].scrollIntoView({ block: "nearest", inline: "nearest" });
    $("scroller").scrollTop = 0;
    fades();
  };
  window.selectTab = function (ix, focus) {
    window.__applyTab(ix, focus);
    render();
  };

  /* ONE listener, on the strip. The rail is inside it, so a key on a rail tab
     already bubbles here. Two listeners ran onKey twice and the selection
     jumped two tabs on one press. */
  strip.addEventListener("keydown", onKey);
  function onKey(e) {
    var k = e.key, ix = TAB;
    if (k === "ArrowRight") ix = (TAB + 1) % TABS.length;
    else if (k === "ArrowLeft") ix = (TAB - 1 + TABS.length) % TABS.length;
    else if (k === "Home") ix = 0;
    else if (k === "End") ix = TABS.length - 1;
    else return;
    e.preventDefault();
    selectTab(ix, true);
  }

  /* the fade is the only signal that tabs sit off screen. Recompute it on every
     scroll and every resize, and again after the font lands, because the rail
     is wider once IBM Plex Mono replaces the fallback. */
  /* THE FADE IS THE WHOLE SIGNAL NOW. the studio removed the two arrow buttons on
     29 August 2026, after the wheel and the middle-drag were added: a button
     that repeats what the wheel already does is a button too many. The fade at
     a rail end stays, because without it nothing says the tabs continue. */
  /* this runs on EVERY scroll event. Writing className unconditionally dirties
     style on every one of them, even when nothing changed; a mask-image repaint
     is not free. Compare first, write only on a real change. */
  var lastFade = "";
  function fades() {
    var over = rail.scrollWidth - rail.clientWidth;
    var l = rail.scrollLeft > 2, r = rail.scrollLeft < over - 2;
    var next = "trail" + (l ? " fadeL" : "") + (r ? " fadeR" : "");
    if (next === lastFade) return;
    lastFade = next;
    rail.className = next;
  }
  rail.addEventListener("scroll", fades);
  window.addEventListener("resize", fades);
  /* A WHEEL OVER THE STRIP PANS IT. the studio, 29 August 2026, reversing his own
     earlier ask: "the scroll here is not so smooth, let just scroll to move the
     whole bar left and right, remove scroll to select."

     He is right, and the reason is worth keeping. SELECTING on a wheel cannot be
     smooth by construction: the smallest thing it can do is jump a whole tab, so
     every notch is a discrete leap and the strip stutters. PANNING maps the
     input to the output one-to-one - move the wheel a little, the bar moves a
     little - which is what "smooth" actually means here. It is also what the OS
     does for shift-wheel, so it needs no learning.

     Two details that make it feel native:
       - Map the delta 1:1 and paint it THIS frame. Never scroll-behavior:smooth
         on an input-driven scroll: the animation lags behind the hand and the
         result feels heavier, not lighter.
       - preventDefault ONLY when the rail actually moved. When every tab already
         fits there is nothing to pan, and swallowing the event there would stop
         the page scrolling under the pointer. */
  strip.addEventListener("wheel", function (e) {
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    var before = rail.scrollLeft;
    rail.scrollLeft = before + d;
    if (rail.scrollLeft !== before) e.preventDefault();
  }, { passive: false });

  /* MIDDLE-MOUSE DRAG PANS IT, the way a middle drag pans a canvas. Hold the
     wheel down and move sideways. preventDefault stops the OS autoscroll cursor
     and stops a middle click pasting on Linux. */
  var pan = null;
  strip.addEventListener("mousedown", function (e) {
    if (e.button !== 1) return;
    e.preventDefault();
    pan = { x: e.clientX, left: rail.scrollLeft };
    strip.style.cursor = "grabbing";
  });
  window.addEventListener("mousemove", function (e) {
    if (!pan) return;
    rail.scrollLeft = pan.left - (e.clientX - pan.x);
  });
  window.addEventListener("mouseup", function () {
    if (!pan) return;
    pan = null;
    strip.style.cursor = "";
  });
  strip.addEventListener("auxclick", function (e) { if (e.button === 1) e.preventDefault(); });
  window.__fades = fades;
  window.__syncTabDone = function () {
    UNITS.forEach(function (u, i) {
      var c = u.querySelector(".card.done") || (u.classList.contains("done") ? u : null);
      if (TABS[i + 1]) TABS[i + 1].classList.toggle("done", !!c);
    });
  };
  fades();
})();

/* OPEN ALL opens every prompt and the spec. It leaves the version histories
   alone on purpose - a deck with ten prompts would otherwise flood with old
   versions. COLLAPSE ALL closes everything, histories included. */
function setAll(open) {
  var d = document.querySelectorAll("details.card, details.meta"), i;
  for (i = 0; i < d.length; i++) d[i].open = open;
  if (!open) {
    var a = document.querySelectorAll("details.archive");
    for (i = 0; i < a.length; i++) a[i].open = false;
  }
}
/* ONE button, a toggle. the studio, 29 August: "merge into 1 button: toggle on off".
   Two buttons for one state is one button too many - the state is either open
   or folded, so the button carries it. Armed (accent) means folded. */
var FOLD_IN  = '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.4 7 5.4l3-3"/><path d="M4 11.6 7 8.6l3 3"/></svg>';
var FOLD_OUT = '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.4 7 2.4l3 3"/><path d="M4 8.6 7 11.6l3-3"/></svg>';
var FOLDED = false;
function drawFold() {
  var b = $("foldAll");
  b.innerHTML = FOLDED ? FOLD_OUT : FOLD_IN;
  b.className = "tb" + (FOLDED ? " on" : "");
  b.setAttribute("data-tip", FOLDED ? "Open everything" : "Collapse everything");
}
$("foldAll").addEventListener("click", function () {
  FOLDED = !FOLDED;
  setAll(!FOLDED);
  drawFold();
});
drawFold();

/* ---------------- copy ----------------
   Legacy execCommand first - it is the one that works inside a sandboxed
   frame. Then the async Clipboard API. Then select the text in place so the
   user can press Cmd/Ctrl+C. The COPIED state is permanent, it never reverts.
   Reads .textContent, so content-visibility never breaks a copy. */
function legacyCopy(text) {
  var ok = false;
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-9999px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    ok = document.execCommand("copy");
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  return ok;
}
function selectInPlace(pre) {
  try {
    var r = document.createRange(); r.selectNodeContents(pre);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  } catch (e) {}
}
function doCopy(text, pre) {
  if (legacyCopy(text)) return Promise.resolve(true);
  if (navigator.clipboard) {
    return navigator.clipboard.writeText(text).then(function () { return true; })
      .catch(function () { if (pre) selectInPlace(pre); return false; });
  }
  if (pre) selectInPlace(pre);
  return Promise.resolve(false);
}
function setState(btn, label, cls) {
  btn.textContent = label;
  btn.classList.remove("copied", "failed");
  if (cls) btn.classList.add(cls);
}
function copyOne(btn, ev) {
  /* the button lives inside a <summary>, so a plain click would also toggle
     the card open or shut. Stop it here. */
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  var pre = btn.closest(".card").querySelector(".prompt-text");
  setState(btn, "COPIED ✓", "copied");
  doCopy(pre.textContent, pre).then(function (ok) {
    if (!ok) setState(btn, "PRESS ⌘/CTRL+C", "failed");
  });
}

/* THE PROMPT IS CLEANED BEFORE IT IS COUNTED OR COPIED.
   A <pre> keeps every space in the markup. The name line sits against the
   opening tag with no indent, and every line after it picks up the indentation
   of the surrounding HTML. On screen that is a gap before the first word. On
   the clipboard it is whitespace the model receives. build-deck.py already
   cleans the file; this repeats it at runtime so a hand-edited deck is right
   too. Runs BEFORE the count, so the number matches what COPY sends. */
(function () {
  function ind(l) { return l.length - l.replace(/^[ \t]+/, "").length; }
  function normalize(text) {
    var lines = text.replace(/\r\n/g, "\n").split("\n"), i, body = [], pad;
    while (lines.length && !lines[0].trim()) lines.shift();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    if (!lines.length) return "";
    for (i = 1; i < lines.length; i++) if (lines[i].trim()) body.push(ind(lines[i]));
    if (ind(lines[0]) === 0 && body.length && Math.min.apply(null, body) > 0) {
      pad = Math.min.apply(null, body);
      for (i = 1; i < lines.length; i++) {
        lines[i] = ind(lines[i]) >= pad ? lines[i].slice(pad) : lines[i].replace(/^[ \t]+/, "");
      }
    } else {
      var all = [];
      for (i = 0; i < lines.length; i++) if (lines[i].trim()) all.push(ind(lines[i]));
      pad = all.length ? Math.min.apply(null, all) : 0;
      if (pad) for (i = 0; i < lines.length; i++) lines[i] = lines[i].trim() ? lines[i].slice(pad) : "";
    }
    return lines.join("\n");
  }
  var pres = document.querySelectorAll(".prompt-text"), j, clean;
  for (j = 0; j < pres.length; j++) {
    clean = normalize(pres[j].textContent);
    if (clean !== pres[j].textContent) pres[j].textContent = clean;
  }
})();

/* CLICK THE PROMPT TO COPY IT. the studio, 29 August 2026: "if user click on the box
   it copy too." The whole block is the target, which is the biggest target on
   the page and the thing he actually wants.
   The one trap: he also selects text inside that block. A click that ends a
   selection must NOT copy, or highlighting a phrase would overwrite the
   clipboard with the whole prompt. So the handler stands down whenever there is
   a live selection. */
(function () {
  var pres = document.querySelectorAll(".prompt-text"), i;
  for (i = 0; i < pres.length; i++) {
    pres[i].style.cursor = "pointer";   /* `copy` draws a big + beside the pointer */
    pres[i].setAttribute("data-tip", "Click to copy this prompt");
    pres[i].addEventListener("click", function () {
      var sel = window.getSelection ? String(window.getSelection()) : "";
      if (sel) return;                       /* they are selecting, not copying */
      var btn = this.closest(".card").querySelector(".copy-btn");
      if (btn) copyOne(btn, null);
    });
  }
})();

/* the character count, written by the engine, never typed. It counts exactly
   what COPY puts on the clipboard, so the number on screen and the number the
   model receives can never disagree. */
(function () {
  var cards = document.querySelectorAll(".card"), i, pre, el;
  for (i = 0; i < cards.length; i++) {
    pre = cards[i].querySelector(".prompt-text");
    el = cards[i].querySelector(".card-head .chars");
    if (pre && el) el.textContent = String(pre.textContent.length) + " CHARS";
  }
})();

/* ---------------- shotlist checkboxes ----------------
   Only a SHOTLIST deck carries them. On a prompt deck this whole block finds
   nothing and stays quiet. A tick survives a reload where storage allows it. */
var CKS = [].slice.call(document.querySelectorAll(".ck"));
if (CKS.length) {
  var CK_KEY = "lotp.done." + (document.title || "deck");
  var DONE = {};
  try { DONE = JSON.parse(localStorage.getItem(CK_KEY) || "{}") || {}; } catch (e) { DONE = {}; }
  var TICK = '<svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 6.3 4.9 8.8 9.6 3.4"/></svg>';
  var ckName = function (c) {
    var h = c.closest(".card-head").querySelector(".tab");
    var u = c.closest(".group") || c.closest(".card");
    return (u && u.getAttribute("data-tab")) || (h ? h.textContent.trim() : "");
  };
  var drawProg = function () {
    var n = 0, i;
    for (i = 0; i < CKS.length; i++) if (CKS[i].classList.contains("on")) n++;
    var el = $("prog");
    el.textContent = n + "/" + CKS.length + " DONE";
    el.className = "chip show";
  };
  CKS.forEach(function (c) {
    c.innerHTML = TICK;
    var on = !!DONE[ckName(c)];
    c.classList.toggle("on", on);
    c.closest(".card").classList.toggle("done", on);
    c.setAttribute("data-tip", "Mark this shot done");
    c.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      var now = !c.classList.contains("on");
      c.classList.toggle("on", now);
      c.closest(".card").classList.toggle("done", now);
      DONE[ckName(c)] = now;
      try { localStorage.setItem(CK_KEY, JSON.stringify(DONE)); } catch (e2) {}
      drawProg();
      if (window.__syncTabDone) window.__syncTabDone();
    });
  });
  drawProg();
  if (window.__syncTabDone) window.__syncTabDone();
}

applySize();
</script>
</body>
</html>
