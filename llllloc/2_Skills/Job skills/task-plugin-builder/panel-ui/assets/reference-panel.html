<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIND</title>
<style>
/* V1.15 - the studio asked for IBM Plex Mono. Bundled in ./fonts, never
   fetched. A remote <link> here is render-blocking: when Premiere
   restarts with the network asleep the request hangs and the panel
   paints NOTHING until it times out. Local files also mean the panel
   works offline, which a sold plugin has to.
   Three weights (400 / 500 / 600) across the three Latin subsets.
   Latin3 carries Vietnamese (U+1EA0-1EF9) and the dong sign, which
   the old Space Mono bundle also covered. IBM Plex has no 700 in
   this bundle - 600 answers for it, which is the weight the design
   actually wants. LICENSE in fonts/IBMPlexMono-LICENSE.txt (OFL).

   SIX files, not nine: check-build.js expects exactly six woff2 per
   panel and that gate is shared by all eleven. It is not ours to
   change without asking, so the bundle was cut to fit it - the
   extended-Latin subset went, because the panel's own words are
   English and the names it shows are ASCII or Vietnamese. Ask the studio
   if he wants Latin2 back; that needs the gate raised first. */
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/IBMPlexMono-400-latin1.woff2") format("woff2");unicode-range:U+0020-007E,U+00A0-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2013-2014,U+2018-201A,U+201C-201E,U+2020-2022,U+2026,U+2030,U+2039-203A,U+2044,U+20AC,U+2122,U+2212,U+FB01-FB02}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/IBMPlexMono-400-latin3.woff2") format("woff2");unicode-range:U+0102-0103,U+01CD-01DC,U+1E0C-1E0D,U+1E12-1E13,U+1E24-1E25,U+1E36-1E37,U+1E3C-1E3D,U+1E40-1E47,U+1E4A-1E4B,U+1E62-1E63,U+1E6C-1E6D,U+1E70-1E71,U+1E92-1E93,U+1EA0-1EF9,U+20AB}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/IBMPlexMono-500-latin1.woff2") format("woff2");unicode-range:U+0020-007E,U+00A0-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2013-2014,U+2018-201A,U+201C-201E,U+2020-2022,U+2026,U+2030,U+2039-203A,U+2044,U+20AC,U+2122,U+2212,U+FB01-FB02}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/IBMPlexMono-500-latin3.woff2") format("woff2");unicode-range:U+0102-0103,U+01CD-01DC,U+1E0C-1E0D,U+1E12-1E13,U+1E24-1E25,U+1E36-1E37,U+1E3C-1E3D,U+1E40-1E47,U+1E4A-1E4B,U+1E62-1E63,U+1E6C-1E6D,U+1E70-1E71,U+1E92-1E93,U+1EA0-1EF9,U+20AB}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/IBMPlexMono-600-latin1.woff2") format("woff2");unicode-range:U+0020-007E,U+00A0-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2013-2014,U+2018-201A,U+201C-201E,U+2020-2022,U+2026,U+2030,U+2039-203A,U+2044,U+20AC,U+2122,U+2212,U+FB01-FB02}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/IBMPlexMono-600-latin1.woff2") format("woff2");unicode-range:U+0020-007E,U+00A0-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2013-2014,U+2018-201A,U+201C-201E,U+2020-2022,U+2026,U+2030,U+2039-203A,U+2044,U+20AC,U+2122,U+2212,U+FB01-FB02}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/IBMPlexMono-600-latin3.woff2") format("woff2");unicode-range:U+0102-0103,U+01CD-01DC,U+1E0C-1E0D,U+1E12-1E13,U+1E24-1E25,U+1E36-1E37,U+1E3C-1E3D,U+1E40-1E47,U+1E4A-1E4B,U+1E62-1E63,U+1E6C-1E6D,U+1E70-1E71,U+1E92-1E93,U+1EA0-1EF9,U+20AB}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/IBMPlexMono-600-latin3.woff2") format("woff2");unicode-range:U+0102-0103,U+01CD-01DC,U+1E0C-1E0D,U+1E12-1E13,U+1E24-1E25,U+1E36-1E37,U+1E3C-1E3D,U+1E40-1E47,U+1E4A-1E4B,U+1E62-1E63,U+1E6C-1E6D,U+1E70-1E71,U+1E92-1E93,U+1EA0-1EF9,U+20AB}
:root{
  --paper:#FFFFFF; --card:#F1F0ED; --ink:#161513; --ink-soft:#8B8A85; --line:#E5E4E0;
  --field:#FFFFFF; --btn:#ECEBE8; --btn-line:#D9D8D4;
  --accent:#F0481E; --accent-dk:#D33E16;
  --radius:1.75px; --radius-sm:1.25px;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
/* DARK RAMP — widened 11 August 2026, option DEEP, chosen by the studio.
   The old ramp put every surface inside one narrow band: a button against the page
   measured 1.26:1, a button border against its button 1.28:1, a divider against the
   page 1.41:1. At the dark end of a screen anything under about 1.4:1 reads as flat
   page, so buttons and fields looked like nothing. Text was never the problem.
   Now: btn/page 1.69:1, btn-line/btn 1.73:1, line/page 2.17:1, ink-soft/page 8.02:1.
   The vermilion accent is untouched. Light mode is untouched.
   The steps are spaced evenly in CIE L*, not evenly in hex, so they read even.
   THIS BLOCK IS BYTE-IDENTICAL IN ALL ELEVEN PANELS. Change it in one, change it in
   all, and update llloc-ui assets/reference-panel.html plus PLUGIN-LOG section 6, or
   the next new panel is born with the old colours. */
html.dark{
  --paper:#0C0C0A; --card:#24231E; --ink:#EFEEE7; --ink-soft:#A7A6A0; --line:#4A4944;
  --field:#1B1B18; --btn:#3A3934; --btn-line:#5D5C57; --accent:#F0481E; --accent-dk:#F5602F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--font-mono);-webkit-font-smoothing:antialiased}
::selection{background:rgba(240,72,30,.26);color:var(--ink)}
::-moz-selection{background:rgba(240,72,30,.26);color:var(--ink)}
html.dark ::selection{background:rgba(240,72,30,.42);color:var(--ink)}
html.dark ::-moz-selection{background:rgba(240,72,30,.42);color:var(--ink)}
/* V1.11 - thin quiet scrollbars, the reference's hairline discipline */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--btn-line);border:2px solid var(--paper);border-radius:0}
::-webkit-scrollbar-thumb:hover{background:var(--ink-soft)}
/* V1.17 - the UI size scaler uses CSS zoom, not transform:scale.
   zoom scales the LAYOUT, so height:100% resolves against the real panel
   and the bottom bar lands on the panel floor with nothing calculated.
   transform:scale only scales the PAINT, which is why V1.14, V1.15 and
   V1.16 each had to compute a layout height and then compensate the
   document height with a margin - and why the page could still scroll at
   S size with nothing down there. See the note above syncZoomHeight. */
#zoomRoot{display:flex;flex-direction:column;zoom:var(--uis,1);height:100%}
.app{width:100%;max-width:none;margin:0;padding:16px 14px 20px;display:flex;flex-direction:column;flex:1;min-height:0}
.hd{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 8px var(--font-mono);letter-spacing:.07em;border:1px solid var(--btn-line);border-radius:var(--radius-sm);padding:0 6px;background:var(--btn);white-space:nowrap;color:var(--ink);height:19px}
.hbtn{width:19px;height:19px;padding:0;border:1px solid var(--btn-line);border-radius:var(--radius-sm);background:var(--btn);color:var(--ink);font-size:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center}
.hbtn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.hbtn.off{color:var(--ink-soft)}
#sizeBtn{font:700 9px var(--font-mono);letter-spacing:.05em}
/* card */
.card{background:transparent;border:none;border-radius:0;overflow:visible;display:flex;flex-direction:column;flex:1;min-height:0}
.cbd{padding:0;display:flex;flex-direction:column;flex:1;min-height:0}
/* fields */
/* V1.11 DESIGN PASS - the studio's fleet-dashboard reference: flat pale blocks on
   the page, borders only where a mode NEEDS them, bigger type, more air.
   LIGHT goes borderless (the reference look). DARK keeps its edges: the DEEP
   ramp measured card/page at 1.24:1, under the 1.45:1 floor in log section 6,
   so a borderless dark field would read as flat page. Buttons stay flat in
   BOTH modes - dark btn/page is 1.69:1, above the floor. */
/* V1.12 - the studio: "align these boxes to be in same size". The search row and
   the FRAMES row are two separate grids, so their boxes were free to drift.
   One height token now drives BOTH, and the toolbar and MATCH CLIP match it.
   Change --row-h and every box in the header moves together. */
/* V1.13 DESIGN PASS 2 - measured against the studio's fleet-dashboard reference.
   What the reference actually does, and what FIND was doing instead:

     reference            FIND before          FIND now
     pale grey pills      pale grey pills      kept
     NO borders           1px borders          borders gone in light
     radius ~4px          1.75px               3px
     weight 400-500       700 everywhere       500 on chrome, 400 on names
     letter-spacing .1em  .03-.09em            .11em on chrome
     generous padding     tight                14px on chips, 34px rows
     text centred in pill text sat high        flex-centred, measured

   Nothing here costs a click path anything - it is all paint. */
/* V1.14 - the studio: "reduce round corner amount of everything by 50%".
   3px -> 1.5px, in the two tokens every component already reads. */
:root{ --row-h:34px; --radius:1.5px; --radius-sm:1.5px }
/* V1.17 - the studio: "try to align things better too".
   This row declared THREE columns and only ever had TWO children, so the
   grid still charged it the 9px gap for a column that was never there.
   The refresh button stopped 9px short of the color swatch below it and
   of the rule under the version bar. Measured: 393.3 against 403.8. */
.frow{display:grid;grid-template-columns:1fr auto;gap:9px}
/* ONE height for every box in the header, and the text sits in the middle
   of each. the studio: "make these boxes the same height as the one below" and
   "align text to the middle". Measured in test-ui U41 / U46. */
.frow .fld,.lrow .fld,.lrow .pill,.lrow .colbtn,.frow .tbar .tb{height:var(--row-h)}
.frow .tbar .tb{width:var(--row-h)}
.lrow .pill{display:flex;align-items:center;justify-content:center;padding:0 14px;line-height:1}
.fld{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:var(--radius-sm);background:var(--card);padding:7px 8px 7px 11px;cursor:text;min-width:0}
/* the X that empties the search box */
.clrb{width:16px;height:16px;padding:0;flex-shrink:0;display:none;align-items:center;justify-content:center;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--ink-soft);cursor:pointer;transition:.12s}
.clrb.show{display:inline-flex}
.clrb:hover{background:var(--accent);color:#fff}
.fld:focus-within{border-color:var(--accent)}
html.dark .fld{background:var(--field);border-color:var(--btn-line)}
html.dark .fld:focus-within{border-color:var(--accent)}
.fld .fl{font:500 9px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);flex-shrink:0}
/* V1.14 - the studio: the search text was too big, and the placeholder is
   one word now. 13px -> 11px. */
.fld input{flex:1;min-width:0;border:none;background:transparent;font:400 11px var(--font-mono);letter-spacing:.09em;color:var(--ink)}
.fld input:focus{outline:none}
.fld input::placeholder{color:var(--ink-soft)}
/* V1.14 - the studio: "fix this duplicate button bug". FRAMES showed TWO up/down
   pairs. One was ours; the other was Chromium's own number spinner, which
   input[type=number] draws unless it is told not to. It was always there
   and only became visible when the row got shorter and the type smaller. */
.fld input[type=number]{-webkit-appearance:none;appearance:none;-moz-appearance:textfield;margin:0}
.fld input[type=number]::-webkit-outer-spin-button,
.fld input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;appearance:none;margin:0;display:none}
/* icon buttons (SORT design system kit) */
.tb{width:24px;height:24px;padding:0;border:1px solid transparent;border-radius:var(--radius-sm);background:var(--btn);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.13s;flex-shrink:0}
.tb:hover:not(:disabled){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tb.on:hover:not(:disabled){background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
.tb:disabled{opacity:.35;cursor:default}
.xb{width:15px;height:15px;padding:0;display:inline-flex;align-items:center;justify-content:center;font:700 9px var(--font-mono);color:var(--ink-soft);background:var(--btn);border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;flex-shrink:0;transition:.13s}
.xb.dim{opacity:.35;pointer-events:none}
.xb:hover{color:#fff;background:var(--accent);border-color:var(--accent)}
.xb.on{color:var(--accent);border-color:var(--accent)}
.xb.on:hover{color:#fff}
.xb.ok:hover{background:var(--ink);border-color:var(--ink)}
.dab{display:flex;flex-direction:column;gap:8px;margin-top:11px}
/* icon toolbar row (SORT design system kit) */
.tbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tbd{width:1px;height:16px;background:var(--line);flex-shrink:0;margin:0 2px}
/* buttons + fields (ADJUST kit, for the MATCH/FRAMES row and the overlay) */
.pill{display:block;width:100%;border:1px solid transparent;border-radius:var(--radius-sm);background:var(--btn);color:var(--ink);font:700 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;padding:9px 12px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;text-align:center}
.pill:hover:not(:disabled){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.acc:hover:not(:disabled){background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.sm{padding:5px 10px;font-size:9.5px;width:auto;display:inline-block}
.pill:disabled{opacity:.4;cursor:default}
.lrow{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-top:10px}
.fld.dim{opacity:.4}
/* label color picker (ADJUST's, verbatim) */
/* V1.11 - the studio: the colour fills the WHOLE button, no little square inside.
   V1.12 - and it is SQUARE: the same width as the shared row height. */
.colbtn{display:flex;align-items:stretch;border:1px solid var(--btn-line);border-radius:var(--radius-sm);background:var(--btn);color:var(--ink);padding:0;width:var(--row-h);flex-shrink:0;cursor:pointer;transition:.13s;overflow:hidden}
.colbtn:hover{border-color:var(--ink)}
.sw{flex:1;border:none;border-radius:0}
.colpop{display:none;margin-top:10px;padding:10px;border:1px solid transparent;border-radius:var(--radius-sm);background:var(--card)}
html.dark .colpop{background:var(--field);border-color:var(--btn-line)}
.colpop.show{display:block}
.swgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.swcell{cursor:pointer;text-align:center}
.swcell .sq{width:100%;height:16px;border:1px solid var(--btn-line);border-radius:var(--radius-sm);transition:.13s}
.swcell:hover .sq{border-color:var(--ink)}
.swcell.on .sq{border-color:var(--accent);outline:1px solid var(--accent);outline-offset:-1px}
.hexrow{display:none;gap:6px;margin-top:9px;align-items:center}
.hexrow.show{display:flex}
.hexrow input{flex:1;min-width:0;font:700 10px var(--font-mono);letter-spacing:.05em;border:1px solid var(--accent);border-radius:var(--radius-sm);padding:5px 8px;background:var(--field);color:var(--ink);text-transform:uppercase}
.hexrow input:focus{outline:none}
.colhint{font:400 9px/1.5 var(--font-mono);color:var(--ink-soft);letter-spacing:.03em;padding:8px 0 2px}
.spin{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.spb{width:18px;height:11px;padding:0;border:1px solid transparent;border-radius:var(--radius-sm);background:var(--btn);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.spb:hover{background:var(--accent);border-color:var(--accent);color:#fff}
/* library bar (shown on the PRESETS chip) */
.libbar{display:flex;align-items:center;gap:4px;margin-top:9px}
/* ---- V1.14: THE LIBRARY DROPDOWN, BUILT INSTEAD OF NATIVE -------------
   the studio asked for an orange highlight, dark mode and better contrast on
   this menu. A native <select> cannot give any of the three: macOS draws
   that popup itself, outside the page, and no CSS in this panel reaches
   it. His screenshots show exactly that - a white popup with a pale green
   system highlight, in a dark panel.

   So the select is gone and the menu is built from the panel's own
   elements. Now it follows the theme, the highlight is the brand
   vermilion, and the contrast is measured like everything else. */
.libname{appearance:none;-webkit-appearance:none;border:none;background:transparent;font:700 9px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);cursor:pointer;max-width:150px;min-width:0;padding:2px 14px 2px 0;text-align:left;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libname:focus{outline:none}
.libname::after{content:"";position:absolute;right:2px;top:50%;margin-top:-1.5px;border:3px solid transparent;border-top-color:currentColor}
.libbar{position:relative}
.lmenu{display:none;position:absolute;left:0;top:100%;margin-top:5px;z-index:40;min-width:150px;max-height:230px;overflow:auto;background:var(--paper);border:1px solid transparent;border-radius:var(--radius-sm);box-shadow:0 6px 20px rgba(0,0,0,.16);padding:3px}
/* the dark menu sits on --btn, not --card: measured, --card is 1.24:1
   against the page and the floor for two separate surfaces is 1.45:1
   (log section 6). --btn is 1.69:1, and its text reads 9.95:1. That is
   the studio's "improve the contrast", in numbers. */
html.dark .lmenu{background:var(--btn);border-color:var(--btn-line);box-shadow:0 6px 20px rgba(0,0,0,.55)}
html.dark .lmi:hover{background:var(--btn-line)}
html.dark .lmi.on:hover{background:var(--accent-dk)}
.lmenu.show{display:block}
.lmi{display:block;width:100%;text-align:left;border:none;background:transparent;color:var(--ink);font:500 9.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;cursor:pointer;border-radius:var(--radius-sm);white-space:nowrap}
.lmi:hover{background:var(--btn)}
.lmi.on{background:var(--accent);color:#fff}
.lmi.on:hover{background:var(--accent-dk);color:#fff}
.newrow{display:none;gap:7px;margin-top:8px}
.newrow.show{display:flex}
.psname{flex:1;min-width:0;font:700 10px var(--font-mono);letter-spacing:.03em;border:1px solid transparent;border-radius:var(--radius-sm);padding:6px 8px;background:var(--card);color:var(--ink);text-transform:uppercase}
html.dark .psname{background:var(--field);border-color:var(--btn-line)}
.psname:focus{outline:none;border-color:var(--accent)}
html.dark .psname:focus{border-color:var(--accent)}
/* overlay (save + rename) */
/* ---- V1.13: THE OVERLAY HE CALLED WASHED OUT, MEASURED ------------------
   the studio: "the contrast here is so bad please improve". He is right, and the
   numbers name it exactly. In light mode the box was --card #F1F0ED and its
   buttons were --btn #ECEBE8:

     DELETE / CANCEL against the box   1.05:1   <- effectively invisible
     the NAME / LIBRARY labels          3.03:1
     the box against the page           1.14:1

   Log section 6 sets the floor at 1.45:1 for two surfaces that must read as
   separate. 1.05:1 is not a surface, it is a rumour.

   Fixed by moving the box UP, not the buttons down: a white box, so its
   pale-grey buttons finally sit on something, plus a real edge and darker
   labels. Now:

     buttons against the box            1.19:1 plus a 1.20:1 border, and the
                                        label text on them reads 4.35:1
     labels                             5.18:1
     the box against the dimmed page    the backdrop is 55% black

   Dark mode was never the complaint and keeps its own surfaces. */
.ovl{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:80;align-items:flex-start;justify-content:center;padding:14px 12px;overflow:auto}
.ovl.show{display:flex}
.ovlc{width:100%;max-width:392px;background:var(--paper);border:1px solid transparent;border-radius:var(--radius);padding:15px 17px 17px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
html.dark .ovlc{background:var(--paper);border-color:transparent;box-shadow:0 8px 28px rgba(0,0,0,.62)}
/* the labels inside the box - 3.03:1 was the complaint, this is 5.18:1 */
.ovlc .elab{color:#6E6D68}
html.dark .ovlc .elab{color:var(--ink-soft)}
/* V1.15 - the studio: "no box in the design system should have stroke". The
   V1.13 border was added for CONTRAST when the box was --card and its
   buttons measured 1.05:1 against it. The box is --paper now, so the same
   buttons read 1.19:1 by tone alone - the identical figure every button in
   the panel already has against the page. The stroke has nothing left to
   do, so it goes, everywhere. Dark mode keeps its edges: measured, those
   surfaces sit too close without them. */
.ovlc .pill{border-color:transparent}
.ovlc .pill.acc{border-color:transparent}
/* DARK follows the same rule - no stroke - and gets its separation from
   TONE instead, which is what his design system uses everywhere else. The
   dark overlay box moves from --card to --paper, and its buttons then read
   1.69:1 against it (--btn on --paper) instead of 1.36:1 (--btn on --card).
   The floor in log section 6 is 1.45:1, so tone alone carries it and the
   stroke is not needed in either mode. */
.ovlc .fld{background:var(--btn);border-color:var(--btn-line)}
html.dark .ovlc .fld{background:var(--field);border-color:var(--btn-line)}
.ovlh{display:flex;align-items:center;gap:9px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.ovlh h3{font:700 11px var(--font-mono);letter-spacing:.14em;text-transform:uppercase}
.ovlh .cst{margin-left:auto;font:700 9px var(--font-mono);letter-spacing:.09em;color:var(--ink-soft);white-space:nowrap}
.elab{font:500 9px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);padding:14px 0 7px}
.efx{border:1px solid transparent;border-radius:var(--radius-sm);background:var(--btn);padding:8px 10px;max-height:150px;overflow:auto}
html.dark .efx{background:var(--field);border-color:var(--btn-line)}
/* V1.13 - the studio: "remove the outer box". The library buttons are already
   boxes. A box around boxes is the thing his reference never does. */
.mvl{border:none;background:transparent;padding:0;max-height:190px;overflow:auto}
/* V1.14 - the studio: "remove stroke form these boxes". The library buttons in
   this box are already blocks of tone. A stroke on top of a fill is the
   thing his reference never does, and the earlier fix put a border on
   every .ovlc .pill for CONTRAST - which these do not need, because they
   are full-width blocks with plenty of edge. */
.ovlc .mvl .pill{border-color:transparent}
.ovlc .mvl .pill:hover{border-color:transparent;background:var(--ink);color:var(--paper)}
/* and a rule that separates CANCEL from the choices above it */
.ovlc .mvl + .dab{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
html.dark .ovlc .mvl + .dab{border-top-color:var(--btn-line)}
.efxr{display:flex;gap:8px;align-items:center;font:700 9px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 0;color:var(--ink);cursor:pointer}
.efxr input{margin:0;flex-shrink:0}
.efxr i{margin-left:auto;font:400 8.5px var(--font-mono);font-style:normal;color:var(--ink-soft);white-space:nowrap}
.efxr.non{color:var(--ink-soft);font-weight:400;text-transform:none;cursor:default}
.mini{appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:var(--radius-sm);background:var(--card) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='6'%3E%3Cpath d='M1 1l3 3 3-3' fill='none' stroke='%23161513' stroke-width='1.4'/%3E%3C/svg%3E") no-repeat right 6px center;color:var(--ink);font:700 8.5px var(--font-mono);letter-spacing:.04em;padding:3px 18px 3px 6px;cursor:pointer;max-width:150px;min-width:0;flex-shrink:0}
html.dark .mini{border-color:var(--btn-line)}
html.dark .mini{background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='6'%3E%3Cpath d='M1 1l3 3 3-3' fill='none' stroke='%23EFEEE7' stroke-width='1.4'/%3E%3C/svg%3E")}
.mini:focus{outline:none;border-color:var(--accent)}
/* filter chips */
.fchips{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.fc{height:26px;padding:0 14px;border:1px solid transparent;border-radius:var(--radius-sm);background:var(--btn);color:var(--ink);font:500 9.5px var(--font-mono);letter-spacing:.13em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.13s;line-height:1}
.fc:hover{background:var(--ink);color:var(--paper)}
.fc.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* results - the list sits straight on the page now, reference style: rows
   and whitespace, no box around the box. The scroll machinery is untouched. */
/* V1.18 - the studio: "leave some gap between row highlight and the scroll
   handle here". The scroll bar lives outside this padding, so 6px here is
   6px of air between the end of a row's highlight and the bar. It also
   holds the highlight off the right edge when there is no bar to clear. */
.res{flex:1;min-height:140px;margin-top:14px;padding-right:6px;border:1px solid transparent;border-radius:var(--radius-sm);background:transparent;overflow:auto;overscroll-behavior:contain}
/* folder rows - the browse view groups vendor packs the way Premiere's own
   Effects panel does. Premiere gives panels no category API, so the folder
   comes off the name prefix (BCC+, S_, ...). Search stays flat. */
/* V1.18 - a folder row keeps the same air on the right as an effect row,
   so a count and a pin sit on one line down the list. */
.frw{display:flex;align-items:center;gap:9px;padding:7px 8px 7px 9px;cursor:pointer;border-left:2px solid transparent;border-radius:var(--radius-sm)}
.frw:hover{background:var(--btn)}
.frw.sel{border-left-color:var(--accent);background:var(--btn)}
.fcv{width:20px;flex-shrink:0;display:inline-flex;justify-content:center;color:var(--ink-soft);transition:transform .12s}
.frw.open .fcv{transform:rotate(90deg)}
.fnm{flex:1;min-width:0;font:500 10.5px/1.5 var(--font-mono);letter-spacing:.13em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.fct{font:400 9.5px var(--font-mono);color:var(--ink-soft);flex-shrink:0;letter-spacing:.06em}
.row.inx{padding-left:22px}
/* V1.18 - the studio: "leave some gap for the button and the end of the row
   hightlight to the right here". V1.17 took this padding to zero to line
   the pins up with the toolbar, and that put a button hard against the
   edge of its own highlight. 8px back. */
.row{display:flex;align-items:center;gap:9px;padding:7px 8px 7px 9px;cursor:pointer;border-left:2px solid transparent;border-radius:var(--radius-sm)}
.row:hover{background:var(--btn)}
.row.sel{border-left-color:var(--accent);background:var(--btn)}
.rtag{font:500 7.5px var(--font-mono);letter-spacing:.1em;color:var(--ink-soft);width:22px;flex-shrink:0}
.rnm{flex:1;min-width:0;font:400 11px/1.5 var(--font-mono);letter-spacing:.045em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbs{display:flex;gap:6px;flex-shrink:0;align-items:center}
.rmore{font:400 8.5px var(--font-mono);color:var(--ink-soft);letter-spacing:.04em;padding:5px 8px}
.note{display:none;font:400 9.5px/1.55 var(--font-mono);color:var(--ink-soft);letter-spacing:.03em;padding:10px 0 0}
.note.show{display:block}
.note.err{color:var(--accent)}
.note.okk{color:var(--ink)}
/* bottom bar */
.foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px;padding:9px 0 0;border-top:1px solid var(--line);font:700 8.5px var(--font-mono);letter-spacing:.05em;color:var(--ink-soft)}
.foot b{color:var(--ink);font-weight:700}
.foot .fbrand{font:700 8.5px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.foot .fby{margin-left:3px}
.foot .fbtns{margin-left:auto;display:flex;align-items:center;gap:11px}
.foot .chip{border:none;background:none;padding:0;height:auto;color:var(--ink);font-size:8.5px;font-weight:700;letter-spacing:.05em;margin-left:-3px}
.foot .hbtn{width:14px;height:14px;min-width:0;padding:0;margin:0;border:none;background:none;color:var(--ink);line-height:1}
.foot .hbtn svg{width:12px;height:12px;display:block}
.foot #sizeBtn{font:700 11px/1 var(--font-mono);letter-spacing:0}
.foot .hbtn:hover{background:none;border-color:transparent;color:var(--accent)}
.foot .hbtn.off{color:var(--ink-soft)}
.foot .hbtn.off:hover{color:var(--accent)}
/* V1.17 - the bottom bar, third and last attempt.
   V1.14 pinned it with position:sticky. V1.15 and V1.16 pinned it with a
   measured minimum height. Both left the page able to scroll, and a page
   that scrolls under a scaled panel puts empty space below the bar.
   The scale now uses CSS zoom, the page height is 100%, and the page
   cannot scroll at all - only the results list scrolls. */
.grow{flex:0 0 0;min-height:0}
/* narrow dock — icon rail anchored in a fixed left column */
/* narrow panels - the studio's 14 Aug screenshots: the search field vanished and
   the toolbar stacked. The field keeps the full width, the buttons wrap
   under it, the length row stacks, and row names NEVER give way to the
   buttons. */
@media (max-width:320px){
  .frow{grid-template-columns:1fr}
  .frow .tbar{justify-content:flex-end}
  .lrow{grid-template-columns:1fr auto}
  .lrow .pill{width:auto}
  .fchips{flex-wrap:wrap}
  .rtag{width:20px}
}
@media (max-width:220px){
  .app{padding:10px 8px 14px}
  .lrow{grid-template-columns:1fr}
  #tip{max-width:150px}
  .foot{flex-direction:column;align-items:center;gap:4px}
  .foot .fby{display:none}
}
#tip{position:fixed;z-index:99;max-width:210px;background:var(--ink);color:var(--paper);font:700 8.5px/1.55 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:var(--radius-sm);pointer-events:none;display:none}
</style>

<script>
/* A blank panel is the worst failure: nothing to read, nothing to click. If any
   boot script throws, show the reason and a reload button instead of nothing. */
window.__findBooted = false;
function panic_find(why) {
  if (window.__findBooted) return;
  try {
    document.body.innerHTML =
      '<div style="font:400 11px/1.6 monospace;color:#EDEBE4;background:#171613;padding:14px">' +
      '<div style="font-weight:700;letter-spacing:.12em;margin-bottom:8px">FIND \u2014 DIDN\'T START</div>' +
      '<div style="color:#8F8E86;margin-bottom:10px">' + String(why || "unknown error").replace(/</g, "&lt;") + '</div>' +
      '<button onclick="location.reload()" style="font:700 10px monospace;letter-spacing:.09em;padding:7px 12px;' +
      'background:#F0481E;color:#fff;border:none;cursor:pointer">RELOAD PANEL</button></div>';
  } catch (e) {}
}
window.addEventListener("error", function (e) {
  panic_find((e && e.message) ? e.message : "script error");
});

/* ---- restore watchdog ----------------------------------------------------
   When Premiere restarts, CEP sometimes brings a docked panel back as an empty
   page. Reopening it from Window > Extensions fixes it because that builds a
   fresh page - so the panel does exactly that for itself: if it still looks
   empty a few seconds in, it reloads. Attempts are counted in the URL hash so
   a genuinely broken build can not loop forever. */
(function () {
  var MAX = 3;
  function tries() {
    var m = /r(\d+)/.exec(window.location.hash || "");
    return m ? parseInt(m[1], 10) : 0;
  }
  function looksEmpty() {
    if (window.__findBooted) return false;
    var zr = document.getElementById("zoomRoot");
    if (!zr) return true;
    if (!zr.offsetHeight || zr.offsetHeight < 8) return true;
    return false;
  }
  function check() {
    if (!looksEmpty()) return;
    var n = tries();
    if (n >= MAX) { panic_find("The panel came back empty after restarting Premiere."); return; }
    try { window.location.hash = "r" + (n + 1); } catch (e) {}
    try { window.location.reload(); } catch (e2) {}
  }
  var AT = [4500], i;
  for (i = 0; i < AT.length; i++) { window.setTimeout(check, AT[i]); }
  window.addEventListener("focus", function () { window.setTimeout(check, 400); });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) window.setTimeout(check, 400);
  });
})();
</script>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };
var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

/* ---------------- theme ---------------- */
var DARK = true;
try { var t0 = localStorage.getItem("find.theme"); if (t0) DARK = (t0 === "dark"); } catch (e) {}
var SUN = '<svg width="12" height="12" viewBox="0 0 14 14"><circle cx="7" cy="7" r="3.1" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 .6v1.7M7 11.7v1.7M.6 7h1.7M11.7 7h1.7M2.5 2.5l1.2 1.2M10.3 10.3l1.2 1.2M11.5 2.5l-1.2 1.2M3.7 10.3l-1.2 1.2"/></g></svg>';
var MOON = '<svg width="12" height="12" viewBox="0 0 14 14"><path d="M12.1 9.1A5.9 5.9 0 0 1 4.9 1.9 5.9 5.9 0 1 0 12.1 9.1Z" fill="currentColor"/></svg>';
function applyTheme() {
  document.documentElement.classList.toggle("dark", DARK);
  $("themeBtn").innerHTML = DARK ? SUN : MOON;
}
$("themeBtn").addEventListener("click", function () {
  DARK = !DARK;
  try { localStorage.setItem("find.theme", DARK ? "dark" : "light"); } catch (e) {}
  applyTheme();
});

/* ---------------- UI size ---------------- */
var SIZES = [["L", 1.16], ["M", 0.98], ["S", 0.83]];
var sizeIx = 0;
try {
  var si = parseInt(localStorage.getItem("find.size") || "0", 10);
  if (si >= 0 && si < SIZES.length) sizeIx = si;
} catch (e) {}
/* V1.17 - THE ARITHMETIC IS GONE, AND THIS IS WHY.
   the studio reported the bottom bar floating at S size three times. V1.14 used
   position:sticky. V1.15 and V1.16 measured window.innerHeight, divided by
   the scale, set that as the layout height, and then corrected the
   document height with a margin.
   MEASURED on the shipped V1.16 at his panel size, 325 by 762:
     L - the page cannot scroll.  M - the page can scroll 14 px.
     S - THE PAGE CAN SCROLL 155 px, and there is nothing down there.
   Scroll it and the search box leaves the top of the panel while the bar
   sits 172 px above the floor. That is his screenshot, in numbers.
   CSS zoom scales the layout instead of the paint, so height:100% reaches
   the panel floor by itself and the page can never scroll. Nothing here is
   calculated, so nothing here can be off by a calculation.
   The name stays because eight places call it. It has no work left. */

/* ---------------- saved ADJUST presets ----------------
   ADJUST mirrors its settings to a real file (llloc-prefs), and one panel may
   read another's file - LINK reads SORT's the same way. FIND reads ADJUST's
   preset libraries from there. The read runs in the panel's own process
   (cep.fs), so it costs Premiere's script line nothing. */
var PRESETS = [];
function presetPath() {
  if (window.LLLOC_FIND_PRESET_PATH) return window.LLLOC_FIND_PRESET_PATH;
  try {
    var base = cs.getSystemPath(SystemPath.USER_DATA);
    if (base) return String(base).split("\\").join("/") + "/CSXS/llllllloc/adjust.json";
  } catch (e) {}
  return "";
}
function loadPresets() {
  PRESETS = [];
  try {
    if (!(window.cep && window.cep.fs)) return;
    var p = presetPath();
    if (!p) return;
    var r = window.cep.fs.readFile(p);
    if (!r || r.err !== 0 || !r.data) return;
    var mirror = JSON.parse(r.data);
    var raw = mirror["adjust.libs"];
    if (!raw) return;
    var db = JSON.parse(raw);
    if (!db || !db.libs) return;
    var i, j, lib, ps;
    for (i = 0; i < db.libs.length; i++) {
      lib = db.libs[i];
      if (!lib || !lib.presets) continue;
      for (j = 0; j < lib.presets.length; j++) {
        ps = lib.presets[j];
        if (!ps || !ps.n) continue;
        PRESETS.push({
          k: "p", n: String(ps.n), lib: String(lib.name || "LIBRARY"),
          c: (typeof ps.c === "number") ? ps.c : -1,
          sp: ps.sp === "seq" ? "seq" : "src",
          comps: ps.comps || []
        });
      }
    }
  } catch (e2) { PRESETS = []; }

      if (it.k === "pp") {

        mb.innerHTML = '<svg width="9" height="9" viewBox="0 0 13 12"><path d="M1.5 2.5h3.2l1 1.4h5.8V10H1.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M5 7h4M7.4 5.4L9 7 7.4 8.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        mb.setAttribute("data-tip", "Move this preset to another library");
        mb.addEventListener("click", function (ev) {
          ev.stopPropagation();

        });
        bs.appendChild(mb);
        var xb = document.createElement("button");
        xb.className = "xb";
        xb.textContent = "\u00d7";

  };
  for (i = 0; i < shown; i++) { window.__findAppendRow(RESULTS[i], i); }

/* V1.12 - grow the list as the studio scrolls. The chunk is the old cap, so the
   first paint is byte-for-byte the same work it always was. This listener
   fires only while he is already scrolling, never on a click. */
function growList() {
  if (SHOWN >= RESULTS.length) return;
  var host = $("resBox");
  var more = MORE_ROW;
  var next = SHOWN + CAP;
  if (next > RESULTS.length) next = RESULTS.length;
  var i;
  for (i = SHOWN; i < next; i++) window.__findAppendRow(RESULTS[i], i);
  SHOWN = next;
  if (more) {
    if (SHOWN >= RESULTS.length) { if (more.parentNode) more.parentNode.removeChild(more); MORE_ROW = null; }
    else {
      host.appendChild(more);
      more.textContent = "+ " + (RESULTS.length - SHOWN) + " MORE — SCROLL DOWN, OR KEEP TYPING TO NARROW IT";
    }
  }
}
$("resBox").addEventListener("scroll", function () {
  var host = this;
  if (host.scrollTop + host.clientHeight >= host.scrollHeight - 120) growList();
});

function keepSelVisible() {
  var host = $("resBox"), rows = host.getElementsByClassName("row");
  if (SEL < 0 || SEL >= rows.length) return;
  var r = rows[SEL];
  if (r.offsetTop < host.scrollTop) host.scrollTop = r.offsetTop;
  else if (r.offsetTop + r.offsetHeight > host.scrollTop + host.clientHeight) {
    host.scrollTop = r.offsetTop + r.offsetHeight - host.clientHeight;
  }
}

/* V1.12 - the X only shows when there is something to clear, so it never

function syncClr() {

  else b.classList.remove("show");
}

$("qFld").addEventListener("click", function (e) { if (e.target !== $("qIn") && e.target.id !== "qClr" && !e.target.closest("#qClr")) $("qIn").focus(); });
syncClr();
$("qIn").addEventListener("keydown", function (e) {
  if (e.key === "ArrowDown") {

    e.preventDefault();

  } else if (e.key === "Escape") {
    if ($("sOvl").className.indexOf("show") >= 0) { closeSaveOvl(); return; }
    if ($("mvOvl").className.indexOf("show") >= 0) { $("mvOvl").classList.remove("show"); return; }
    if ($("libMenu").className.indexOf("show") >= 0) { $("libMenu").classList.remove("show"); return; }
    if ($("colPop").className.indexOf("show") >= 0) { $("colPop").classList.remove("show"); return; }
    if ($("qIn").value) { $("qIn").value = ""; SEL = 0; syncClr(); render(); }
  }
});

/* ---------------- Premiere bridge ---------------- */
var cs = null, busy = false, busyList = false;
try { cs = new CSInterface(); } catch (e) { cs = null; }
function hostOK() { return !!(cs && window.__adobe_cep__); }
function loadJSX(cb) {
  try {
    var p = cs.getSystemPath(SystemPath.EXTENSION) + "/jsx/hostscript.jsx";
    p = p.split("\\").join("/");
    cs.evalScript('$.evalFile("' + p + '")', function () { cb(); });
  } catch (e) { cb(); }
}
function callHost(fn, cb, _retried) {
  if (!hostOK()) {
    status("OPEN THIS PANEL INSIDE PREMIERE PRO (WINDOW \u2192 EXTENSIONS \u2192 FIND).", true);
    return;
  }
  cs.evalScript(fn, function (r) {
    var data = null;
    try { data = JSON.parse(r); } catch (e) {}
    if (!data) {
      if (!_retried) { loadJSX(function () { callHost(fn, cb, true); }); return; }
      status("COULD NOT TALK TO PREMIERE \u2014 IS A SEQUENCE OPEN? TRY RESTARTING PREMIERE.", true);
      return;
    }
    cb(data);
  });
}
/* Every payload crosses evalScript percent-encoded: a third-party effect name
   can carry any character, and one non-ASCII byte breaks the transport. */
function hostCall(fn, payload, cb) {
  var arg = JSON.stringify(encodeURIComponent(JSON.stringify(payload)));
  callHost("FIND." + fn + "(" + arg + ")", cb);
}

function panelVer() {
  try { return (document.querySelector(".foot .chip").textContent || "").replace(/^V/, ""); }
  catch (e) { return ""; }
}

/* ---------------- read the effect lists ---------------- */
function refreshList(manual) {
  if (busyList) return;
  if (!hostOK()) {
    if (manual) status("OPEN THIS PANEL INSIDE PREMIERE PRO (WINDOW \u2192 EXTENSIONS \u2192 FIND).", true);
    return;
  }
  busyList = true;
  if (manual) status("READING PREMIERE'S EFFECT LISTS\u2026", false);
  var t0 = Date.now();
  callHost("FIND.list()", function (d) {
    busyList = false;
    if (!d.ok) {
      status("PREMIERE DID NOT HAND OVER THE EFFECT LISTS \u2014 " + String(d.error).toUpperCase(), true);
      return;
    }
    FX = { v: d.v || [], a: d.a || [], tv: d.tv || [], ta: d.ta || [] };
    try { localStorage.setItem("find.fx", JSON.stringify({ v: FX.v, a: FX.a, tv: FX.tv, ta: FX.ta, t: Date.now() })); } catch (e) {}
    render();
    if (manual) {
      status(FX.v.length + " VIDEO \u00B7 " + FX.a.length + " AUDIO EFFECTS \u00B7 READ IN " + (Date.now() - t0) + " MS.", false, true);
    }
  });
  setTimeout(function () { busyList = false; }, 8000);
}
$("reBtn").addEventListener("click", function () { loadPresets(); loadPP(); refreshList(true); renderLibBar(); render(); });

/* ---------------- one entry point for every apply gesture ----------------
   Routes a row click, Enter, Cmd/Ctrl+Enter and the circle button. The
   ADJUSTMENT-LAYER-BY-DEFAULT toggle turns a plain gesture into the layer
   route for video effects. A repeat of the same gesture inside half a second
   is dropped - a double-click must not apply the effect twice. */
var lastAct = { key: "", t: 0 };
function runItem(it, wantAL) {
  var key = (it.k === "dir" ? "dir:" + it.n : pinKeyOf(it)) + (wantAL ? ":al" : "") + (ALDEF ? ":d" : "");
  var now = Date.now();
  if (key === lastAct.key && (now - lastAct.t) < 500) return;
  lastAct.key = key;
  lastAct.t = now;
  if (it.k === "dir") {
    FOLD_OPEN[it.n] = !FOLD_OPEN[it.n];
    render(); keepSelVisible();
    return;
  }
  window.__findActs = (window.__findActs || 0) + 1;
  if (it.k === "lib") {
    /* a copied Premiere preset keeps the lane that is proven for it */
    if (it.filters && it.filters.length) { doPPreset(it, wantAL || ALDEF); return; }
    doLibPreset(it); return;
  }
  if (it.k === "cmb") { doCombo(it); return; }
  if (it.k === "tv" || it.k === "ta") { doTransition(it); return; }
  if (it.k === "p") { doPreset(it); return; }
  if (it.k === "pp") { doPPreset(it, wantAL || (ALDEF && it.kind !== "a")); return; }
  if (it.k === "v" && (wantAL || ALDEF)) { doAdjust(it); return; }
  if (it.k === "a" && wantAL) {
    status("AUDIO HAS NO ADJUSTMENT LAYER \u2014 ENTER APPLIES IT TO THE SELECTED AUDIO CLIPS.", true);
    return;
  }
  doApply(it);
}

/* ---------------- apply a transition ---------------- */
function doTransition(it, pos) {
  if (busy) return;
  busy = true;
  var t0 = Date.now();
  hostCall("applyTransition", { name: it.n, kind: it.k, frames: FRAMES, pos: pos || "auto" }, function (d) {
    busy = false;
    var ms = Date.now() - t0;
    if (!d.ok) {
      var err = String(d.error);
      if (err === "NO_SELECTION") status("SELECT A CLIP IN THE TIMELINE FIRST — THE TRANSITION GOES AT ITS END.", true);
      else if (err === "TRANSITION_NOT_FOUND") status("PREMIERE DOES NOT KNOW “" + it.n + "” — PRESS THE REFRESH ARROWS.", true);
      else status(err.toUpperCase(), true);
      return;
    }
    var msg = "TRANSITION " + it.n.toUpperCase() + " · " + d.frames + " FRAMES";
    if (d.cuts) msg += " · ON " + d.cuts + " CUT" + (d.cuts === 1 ? "" : "S") + " BETWEEN CLIPS";
    else if (d.pos === "start") msg += " · AT THE START OF " + d.clips + " CLIP" + (d.clips === 1 ? "" : "S");
    else msg += " · AT THE END OF " + d.clips + " CLIP" + (d.clips === 1 ? "" : "S");
    if (d.noPair) msg += " · NO TWO SELECTED CLIPS TOUCH ON ONE TRACK, SO EACH GOT IT AT ITS END — FOR THE CUT, SELECT TWO TOUCHING CLIPS ON THE SAME TRACK";
    if (d.on) msg += " · " + d.on + " CONFIRMED ON";
    if (d.laneIn) msg += " · WRITTEN AT THE EARLIER CLIP'S END, WHICH IS THE CUT";
    if (d.laneOut) msg += " · " + d.laneOut + " FELL BACK TO THE OTHER EDGE";
    /* V1.13 - WHERE it landed, measured, not assumed. Three builds said
       CONFIRMED over a transition on the wrong edge because the only
       witness was a count. */
    /* V1.15 - a placement is only ever printed over a CONFIRMED write. In
       V1.14 the two answers could disagree and the louder one won: the line
       said IT SITS ACROSS THE CUT over an empty timeline. */
    if (d.placedAt === "straddles") {
      msg += " · MEASURED: IT SITS ACROSS THE CUT";
    } else if (d.placedAt === "measured") {
      msg += " · MEASURED: IT TOUCHES THE CUT BUT DOES NOT SIT ACROSS IT — SEND ME THIS LINE AND I WILL DROP THE CUT BUTTON AND LEAVE YOU THE TWO ARROWS";
    } else if (d.placedAt === "unreadable") {
      msg += " · PREMIERE WOULD NOT SAY WHERE IT LANDED — CHECK THE CUT ONCE";
    }
    if (d.sent) msg += " · " + d.sent + " SENT — PREMIERE GIVES NO READ-BACK FOR TRANSITIONS, CHECK THE CUT ONCE";
    if (d.failed) msg += " · " + d.failed + " FAILED";
    msg += " · " + ms + " MS. UNDO REVERTS.";
    status(msg, d.on + d.sent === 0, d.failed === 0 && d.on > 0);
  });
  setTimeout(function () { busy = false; }, 6000);
}

/* ---------------- apply to the selected clips ---------------- */
function doApply(it) {
  if (busy) return;
  busy = true;
  var t0 = Date.now();
  hostCall("applyFx", { name: it.n, kind: it.k }, function (d) {
    busy = false;
    var ms = Date.now() - t0;
    if (!d.ok) {
      var err = String(d.error);
      if (err === "NO_SELECTION") status("SELECT A CLIP IN THE TIMELINE FIRST.", true);
      else if (err === "EFFECT_NOT_FOUND") status("PREMIERE DOES NOT KNOW \u201C" + it.n + "\u201D \u2014 PRESS THE REFRESH ARROWS TO RE-READ THE LIST.", true);
      else status(err.toUpperCase(), true);
      return;
    }
    if (d.on === 0) {
      var bad = it.n.toUpperCase() + " DID NOT GO ON \u2014 PREMIERE TOOK THE COMMAND AND NOTHING APPEARED";
      if (d.unverified) bad += " ON " + d.unverified + " CLIP" + (d.unverified === 1 ? "" : "S");
      bad += ". SOME LIST ENTRIES ARE OLD EFFECTS PREMIERE NO LONGER APPLIES. CHECK EFFECT CONTROLS ONCE \u2014 " + ms + " MS.";
      status(bad, true);
      return;
    }
    var msg = "APPLIED " + it.n.toUpperCase() + " \u00B7 " + d.on + " CLIP" + (d.on === 1 ? "" : "S");
    if (d.unverified) msg += " \u00B7 " + d.unverified + " MORE SENT, NOT READ BACK \u2014 CHECK EFFECT CONTROLS";
    if (d.refused) msg += " \u00B7 " + d.refused + " CLIP" + (d.refused === 1 ? "" : "S") + " REFUSED IT";
    msg += " \u00B7 " + ms + " MS. UNDO REVERTS.";
    status(msg, false, true);
  });
  setTimeout(function () { busy = false; }, 6000);
}

/* ---------------- apply a saved PREMIERE preset ---------------- */
function doPPreset(it, al) {
  if (busy) return;
  if (al && it.kind === "a") {
    status("AUDIO HAS NO ADJUSTMENT LAYER — ENTER APPLIES IT TO THE SELECTED AUDIO CLIPS.", true);
    return;
  }
  busy = true;
  var t0 = Date.now();
  hostCall("applyPreset", { name: it.n, kind: it.kind, al: !!al, filters: it.filters, mode: placeMode(), frames: FRAMES, color: COLOR }, function (d) {
    busy = false;
    var ms = Date.now() - t0;
    if (!d.ok) {
      var err = String(d.error);
      if (err === "NO_SELECTION") status("SELECT A CLIP IN THE TIMELINE FIRST.", true);
      else if (err === "NO_SOURCE") status("NO ADJUSTMENT LAYER IN THIS PROJECT — PLACE ANY EFFECT AS A LAYER ONCE, OR MAKE ONE IN ADJUST.", true);
      else if (err === "NO_TARGET") status("SELECT A CLIP, OR PARK THE PLAYHEAD OVER ONE.", true);
      else status(err.toUpperCase(), true);
      return;
    }
    var msg = "PRESET “" + it.n.toUpperCase() + "”";
    if (d.al) {
      msg += " ON AN ADJUSTMENT LAYER ON V" + d.track + " · " + d.frames + " FRAME" + (d.frames === 1 ? "" : "S");
      if (d.matched) msg += " (MATCHED)";
      if (d.moved) msg += " · MOVED UP A TRACK, THE ONE ABOVE WAS BUSY";
      if (d.labeled === false) msg += " · PREMIERE REFUSED THE COLOR LABEL";
    } else {
      msg += " · " + d.clips + " CLIP" + (d.clips === 1 ? "" : "S");
    }
    msg += " · " + d.filtersOn + " FILTER" + (d.filtersOn === 1 ? "" : "S") + " ON · " + d.applied + " PARAM" + (d.applied === 1 ? "" : "S");
    if (d.keys) msg += " · " + d.keys + " KEYFRAMES, EASING APPROX";
    if (d.colorsExact) msg += " · " + d.colorsExact + " COLOR" + (d.colorsExact === 1 ? "" : "S") + " FROM YOUR PREMIERE PRESET, SET EXACTLY";
    if (d.colorsFixed) msg += " · " + d.colorsFixed + " COLOR" + (d.colorsFixed === 1 ? "" : "S") + " FIXED";
    if (d.colorsUnv) msg += " · " + d.colorsUnv + " COLOR" + (d.colorsUnv === 1 ? "" : "S") + " NOT VERIFIED — CHECK THEM ONCE";
    if (d.colorSeen && d.colorSeen.length) msg += " · COLOR CHECK: " + d.colorSeen.join(" · ");
    if (d.mismatched) msg += " · " + d.mismatched + " SETTING" + (d.mismatched === 1 ? "" : "S") + " SKIPPED — THIS EFFECT'S CONTROLS DO NOT LINE UP WITH THE PRESET, SO NOTHING WAS FORCED";
    if (d.skipped) msg += " · " + d.skipped + " PARAM" + (d.skipped === 1 ? "" : "S") + " SKIPPED";
    if (d.filtersMissed) msg += " · " + d.filtersMissed + " FILTER" + (d.filtersMissed === 1 ? "" : "S") + " NOT ON THIS MACHINE";
    if (d.al) {
      if (d.fit === "ok") msg += " · FITTED TO THE FRAME (SCALE " + d.fitScale + ")";
      else if (d.fit === "motion") msg += " · FIT SKIPPED — THE PRESET SETS MOTION";
      else if (d.fit === "keys") msg += " · FIT SKIPPED — POSITION OR SCALE IS ANIMATED";
    }
    msg += " · " + ms + " MS. UNDO REVERTS.";
    status(msg, d.filtersOn === 0, d.filtersOn > 0 && !d.filtersMissed);
  });
  setTimeout(function () { busy = false; }, 6000);
}

/* ---------------- FIND's own presets: apply ---------------- */
function doLibPreset(it) {
  if (busy) return;
  busy = true;
  var t0 = Date.now();
  hostCall("applyAdjust", { name: it.n, kind: "v", comps: it.comps, space: it.sp || "src", color: colorFor(it), mode: placeMode(), frames: FRAMES }, function (d) {
    busy = false;
    var ms = Date.now() - t0;
    if (!d.ok) {
      var err = String(d.error);
      if (err === "NO_SOURCE") status("NO ADJUSTMENT LAYER IN THIS PROJECT — PLACE ANY EFFECT AS A LAYER ONCE, OR MAKE ONE IN ADJUST.", true);
      else if (err === "NO_TARGET") status("SELECT A CLIP, OR PARK THE PLAYHEAD OVER ONE.", true);
      else status(err.toUpperCase(), true);
      return;
    }
    var msg = "PRESET “" + it.n.toUpperCase() + "” ON V" + d.track + " · " + d.frames + " FRAME" + (d.frames === 1 ? "" : "S");
    if (d.matched) msg += " (MATCHED)";
    if (d.moved) msg += " · MOVED UP A TRACK, THE ONE ABOVE WAS BUSY";

  var from = FLIBS.libs[it.li], to = FLIBS.libs[toLi];

   COPY: the same filters, under FIND's own name, in FIND's own storage. His
   Premiere presets are untouched, and the copy can be renamed and moved. */
function copyPPreset(it, toLi) {
  var to = FLIBS.libs[toLi];
  if (!to) { status("NO LIBRARY TO COPY INTO — PRESS + BY THE LIBRARY NAME.", true); return; }
  var base = String(it.n).slice(0, 24), nm = base, k = 2, j, hit;
  function exists(x) { hit = false; for (j = 0; j < to.presets.length; j++) { if (to.presets[j].n === x) hit = true; } return hit; }
  while (exists(nm)) { nm = (base + " " + k).slice(0, 24); k++; }
  to.presets.push({ n: nm, kind: "s", pkind: it.kind === "a" ? "a" : "v",
                    filters: it.filters, c: COLOR });
  FLIBS.cur = toLi;
  saveFLibs();
  LVIEW = "u"; saveLView();
  $("mvOvl").classList.remove("show");

  status("COPIED “" + nm + "” INTO " + to.name + ". YOUR PREMIERE PRESET IS UNCHANGED — THE PEN RENAMES THE COPY.", false, true);

/* ---------------- apply as an adjustment layer ----------------
   ADJUST's machinery, on the studio's instruction. The layer spans the selected
   clips, lands on the first free track above them, and takes the effect's
   name. In a project with no adjustment layer at all, the panel asks
   Premiere's own File > New > Adjustment Layer (macOS) - same as ADJUST. */

function isMac() {
  try { return String(navigator.platform).toLowerCase().indexOf("win") < 0; } catch (e) { return true; }

/* The helper script RETURNS a result string on stdout, so a failure names
   itself instead of being blamed on the likeliest cause. The dialog is
   confirmed by clicking ITS OWN OK button - never a blind Return, which
   would land in the timeline if the dialog were already gone. */
/* V1.9: the studio's V1.8 report said NODIALOG - the menu click ran and nothing
   opened. File > New > Adjustment Layer is DISABLED while a panel has
   focus; his right-click way works because the Project panel has focus
   first. So: Shift+1 (Premiere's own Focus Project Panel key) BEFORE the
   menu, and the dialog's OK is hunted in windows AND sheets. */
var NATIVE_LINES = [
  "on run",
  "delay 0.15",
  "try",
  "tell application \"System Events\"",
  "set pp to first application process whose frontmost is true",
  "tell pp",
  "set frontmost to true",
  "end tell",
  "key code 18 using shift down",
  "delay 0.35",
  "tell pp",
  "try",
  "click (first menu item of menu 1 of menu item \"New\" of menu 1 of menu bar item \"File\" of menu bar 1 whose name begins with \"Adjustment Layer\")",
  "on error",
  "click (first menu item of menu 1 of menu item 1 of menu 1 of menu bar item 3 of menu bar 1 whose name begins with \"Adjustment Layer\")",
  "end try",
  "end tell",
  "end tell",
  "on error m number nn",
  "return \"ERR \" & nn & \": \" & m",
  "end try",
  "set clicked to false",
  "repeat 12 times",
  "delay 0.35",
  "try",
  "tell application \"System Events\"",
  "tell (first application process whose frontmost is true)",
  "if exists (button \"OK\" of window 1) then",
  "click button \"OK\" of window 1",
  "set clicked to true",
  "else if exists (sheet 1 of window 1) then",
  "if exists (button \"OK\" of sheet 1 of window 1) then",
  "click button \"OK\" of sheet 1 of window 1",
  "set clicked to true",
  "end if",
  "end if",
  "end tell",
  "end tell",
  "end try",
  "if clicked then exit repeat",
  "end repeat",
  "if clicked then",
  "return \"OK\"",
  "else",
  "return \"NODIALOG\"",
  "end if",
  "end run"
];

var NATIVE_OUT = "";
function spawnNative() {
  if (!(window.cep && window.cep.process && window.cep.process.createProcess)) return false;
  var argv = ["/usr/bin/osascript"], i;
  for (i = 0; i < NATIVE_LINES.length; i++) { argv.push("-e"); argv.push(NATIVE_LINES[i]); }
  NATIVE_OUT = "";
  try {
    var r = window.cep.process.createProcess.apply(window.cep.process, argv);
    if (!(r && (r.err === 0 || r.err === undefined))) return false;
    try {
      if (r.data !== undefined && window.cep.process.stdout) {
        window.cep.process.stdout(r.data, function (out) {
          NATIVE_OUT += String(out || "");
        });
      }
    } catch (eo) {}
    return true;
  } catch (e) { return false; }
}

/* Turn the helper's own words into the RIGHT instruction. */
function nativeWhy() {
  var t = NATIVE_OUT || "";
  if (/assistive|not allowed|not authori|1743|25211/i.test(t)) {
    return "MACOS BLOCKED THE HELPER. OPEN SYSTEM SETTINGS → PRIVACY & SECURITY → ACCESSIBILITY, SWITCH ADOBE PREMIERE PRO ON, THEN TRY AGAIN. (AUTOMATION, ONE PANE UP, MUST ALSO ALLOW PREMIERE → SYSTEM EVENTS.)";
  }
  if (/ERR .*menu/i.test(t)) {
    return "THE FILE → NEW → ADJUSTMENT LAYER MENU WAS NOT WHERE EXPECTED. MAKE ONE ADJUSTMENT LAYER BY HAND — THE PANEL COPIES IT FROM THEN ON. THEN SEND ME THIS LINE: " + t.slice(0, 120);
  }
  if (/NODIALOG/.test(t)) {
    return "PREMIERE OPENED NO ADJUSTMENT LAYER DIALOG. THE PANEL PRESSES SHIFT+1 TO FOCUS THE PROJECT PANEL FIRST — IF SHIFT+1 IS NOT “FOCUS PROJECT PANEL” ON YOUR KEYBOARD, TELL ME WHICH KEY IS. FOR NOW: RIGHT-CLICK THE PROJECT PANEL → NEW ITEM → ADJUSTMENT LAYER, AND THE PANEL COPIES IT FROM THEN ON.";
  }
  return "PREMIERE DID NOT MAKE THE LAYER. OPEN SYSTEM SETTINGS → PRIVACY & SECURITY → ACCESSIBILITY AND SWITCH ADOBE PREMIERE PRO ON, OR MAKE ONE ADJUSTMENT LAYER BY HAND (FILE → NEW → ADJUSTMENT LAYER).";
}

function nativeCreate(name, done, giveUp) {
  if (!isMac()) {
    giveUp("NO ADJUSTMENT LAYER IN THIS PROJECT. MAKE ONE BY HAND (FILE \u2192 NEW \u2192 ADJUSTMENT LAYER) \u2014 THE PANEL COPIES IT FROM THEN ON.");
    return;
  }
  status("NO ADJUSTMENT LAYER IN THIS PROJECT \u2014 ASKING PREMIERE TO MAKE ONE\u2026", false);
  callHost("FIND.snapshot()", function (snap) {
    if (!snap.ok) { giveUp(String(snap.error).toUpperCase()); return; }
    var idArg = JSON.stringify(encodeURIComponent(JSON.stringify({ ids: snap.ids || [], name: name || "" })));
    var call = "FIND.adopt(" + idArg + ")";
    if (!spawnNative()) {
      giveUp("THE PANEL COULD NOT START THE HELPER. MAKE ONE ADJUSTMENT LAYER BY HAND (FILE \u2192 NEW \u2192 ADJUSTMENT LAYER). THE PANEL COPIES IT FROM THEN ON.");
      return;
    }
    var tries = 0;
    function poll() {
      tries++;
      callHost(call, function (d) {
        if (d.ok && d.found) { done(d); return; }
        if (tries >= 14) {
          giveUp(nativeWhy());
          return;
        }
        setTimeout(poll, 600);
      });
    }
    setTimeout(poll, 900);
  });
}

function doAdjust(it, extra) {
  if (busy && !(extra && extra.retry)) return;
  busy = true;
  var stage = (extra && extra.stage) ? extra.stage : 0;
  var payload = { name: it.n, kind: it.k, mode: placeMode(), frames: FRAMES, color: COLOR };
  if (extra && extra.useId) payload.useId = extra.useId;
  var t0 = Date.now();
  hostCall("applyAdjust", payload, function (d) {
    busy = false;
    var ms = Date.now() - t0;
    if (!d.ok) {
      var err = String(d.error);
      if ((err === "NO_SOURCE" || err === "CLONE_FAILED") && stage === 0) {
        nativeCreate(it.n, function (n) {
          doAdjust(it, { retry: true, stage: 1, useId: n.id });
        }, function (why) { status(why, true); });
        return;
      }
      if (err === "NO_TARGET") status("SELECT A CLIP, OR PARK THE PLAYHEAD OVER ONE.", true);
      else status(err.toUpperCase(), true);
      return;
    }
    var msg = "ADJUSTMENT LAYER \u201C" + it.n.toUpperCase() + "\u201D ON V" + d.track + " \u00B7 " + d.frames + " FRAME" + (d.frames === 1 ? "" : "S");
    if (d.matched) msg += " (MATCHED)";
    if (d.moved) msg += " \u00B7 MOVED UP A TRACK, THE ONE ABOVE WAS BUSY";
    if (d.fx === "on") msg += " \u00B7 EFFECT ON";
    else if (d.fx === "unverified") msg += " \u00B7 THE EFFECT DID NOT APPEAR ON IT \u2014 LIKELY AN OLD EFFECT NAME. CHECK EFFECT CONTROLS ONCE";
    else msg += " \u00B7 THE EFFECT DID NOT GO ON \u2014 DROP IT ON THE LAYER BY HAND";
    if (d.fit === "ok") msg += " \u00B7 FITTED TO THE FRAME (SCALE " + d.fitScale + ")";
    else if (d.fit === "keys") msg += " \u00B7 FIT SKIPPED \u2014 POSITION OR SCALE IS ANIMATED";
    else msg += " \u00B7 FIT NOT PROVED \u2014 CHECK THE LAYER FILLS THE FRAME";
    if (!d.isAdjustment) msg += " \u00B7 WARNING: THAT SOURCE IS NOT AN ADJUSTMENT LAYER";
    if (d.named === false) msg += " \u00B7 PREMIERE REFUSED THE NAME";
    if (d.labeled === false) msg += " \u00B7 PREMIERE REFUSED THE COLOR LABEL";
    msg += " \u00B7 " + ms + " MS. UNDO REVERTS.";
    status(msg, d.fx !== "on", d.fx === "on");
  });
  setTimeout(function () { busy = false; }, 6000);
}

/* ---------------- panel menu + host hooks ---------------- */
function installPanelMenu() {
  /* The flyout menu is owned by js/llloc-revive.js, which loads before
     everything else - so Reload / Fix blank panel / Startup report exist
     even when this script never ran. FIND adds nothing of its own yet. */
  if (!window.LLLOC_MENU_ADD) return;
}
function installHostHooks() {
  if (!cs || !window.__adobe_cep__) return;
  var evts = ["com.adobe.csxs.events.ApplicationActivate",
              "com.adobe.csxs.events.WindowVisibilityChanged",
              "com.adobe.csxs.events.ThemeColorChanged",
              "applicationActivate", "documentAfterActivate"];
  var i;
  for (i = 0; i < evts.length; i++) {
    try { cs.addEventListener(evts[i], function () { try { applySize(); } catch (e) {} }); } catch (e2) {}
  }
}
function markBooted() {
  window.__findBooted = true;
  try {
    if (window.location.hash) {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", window.location.pathname);
      } else { window.location.hash = ""; }
    }
  } catch (e) {}
}

/* The whole point of FIND: the search box is ready the moment the panel is. */
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) setTimeout(focusQ, 60);
});
window.addEventListener("focus", function () { setTimeout(focusQ, 60); });

/* ---------------- boot ---------------- */
applyTheme();
applyTips();
applySize();
applyAlDef();
syncLen();
syncMatch();
renderSwatches();
renderLibBar();
loadPresets();
setFilter(FILTER === "v" || FILTER === "a" || FILTER === "t" || FILTER === "pre" ? FILTER : "all");
focusQ();

try { installPanelMenu(); installHostHooks(); markBooted(); } catch (e) {}

/* The Premiere preset file is 3.6 MB - read and parse it OFF the open path,
   a moment after first paint, in the panel's own process. Opening FIND never
   waits on it. */
setTimeout(function () {
  try { loadPP(); renderLibBar(); render(); } catch (e) {}
}, 350);

/* One list read per session, off the click path. With an empty saved copy it
   runs at once - the panel is useless without a list. With a saved copy it
   waits a moment so opening the panel costs Premiere nothing, then quietly
   picks up anything new. The stale-install warning rides the same ping. */
if (hostOK()) {
  callHost("FIND.ping()", function (d) {
    if (d.ok && d.ver && panelVer() && String(d.ver) !== panelVer()) {
      status("YOUR INSTALL IS HALF OLD \u2014 PANEL V" + panelVer() + ", ENGINE V" + d.ver + ". RUN THE FIND INSTALLER AGAIN.", true);
    }
  });
  if (!FX.v.length && !FX.a.length) refreshList(true);
  else setTimeout(function () { refreshList(false); }, 1200);
}
</script>
